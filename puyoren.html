<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Puyo Chain Practice - 80s Arcade Edition</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 45 45%22%3E%3Cpath d=%22M22.5 7C12 7 4 14 2.5 23 1 34 7 42 22.5 42S44 34 42.5 23 33 7 22.5 7Z%22 fill=%22%23ff1744%22 stroke=%22%23880015%22 stroke-width=%222.5%22 stroke-linejoin=%22round%22/%3E%3Cellipse cx=%2212%22 cy=%2214%22 rx=%226%22 ry=%223%22 fill=%22white%22 opacity=%22.6%22 transform=%22rotate(-25 12 14)%22/%3E%3Ccircle cx=%2215.5%22 cy=%2225%22 r=%226%22 fill=%22white%22 stroke=%22%23880015%22 stroke-width=%221.5%22/%3E%3Ccircle cx=%2229.5%22 cy=%2225%22 r=%226%22 fill=%22white%22 stroke=%22%23880015%22 stroke-width=%221.5%22/%3E%3Ccircle cx=%2215.5%22 cy=%2225%22 r=%222%22 fill=%22%230f172a%22/%3E%3Ccircle cx=%2229.5%22 cy=%2225%22 r=%222%22 fill=%22%230f172a%22/%3E%3C/svg%3E">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        :root {
            --bg-dark-1: #000000;
            --bg-dark-2: #050518;
            --field-bg: #1f1f6a;
            --cell-size: min(calc((100vw - 136px) / 6), calc((100dvh - 90px) / 13.2), 60px);
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: linear-gradient(135deg, var(--bg-dark-1) 0%, var(--bg-dark-2) 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #ffff00;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
            position: relative;
        }

        .top-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 380px;
            margin-bottom: 8px;
            z-index: 20;
        }

        .score-box {
            flex: 1;
            min-width: 0;
            margin-bottom: 0;
            padding: 5px 8px;
        }

        .stage-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            max-width: 600px;
            flex: 1;
            position: relative;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 8px;
            width: 46px;
            height: calc(var(--cell-size) * 13 + 10px);
            flex-shrink: 0;
            z-index: 30;
            padding-top: 2px;
        }

        .right-panel {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            width: 58px;
            height: calc(var(--cell-size) * 13 + 10px);
            flex-shrink: 0;
            pointer-events: none;
            z-index: 30;
        }

        .right-top {
            display: flex;
            flex-direction: column;
            width: 100%;
            pointer-events: auto;
        }

        .panel-box {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            border: 2px solid #2121ff;
            border-radius: 6px;
            padding: 4px 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 8px rgba(33, 33, 255, 0.6);
            margin-bottom: 6px;
        }

        .panel-lbl { font-size: 10px; font-weight: 800; color: #00ffff; letter-spacing: -0.2px; margin-bottom: 2px; white-space: nowrap; }
        .score-box .panel-lbl { color: #ffff00; }
        .stat-val { font-size: clamp(16px, 2.6vh, 22px); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
        .curr-val { color: #ffffff; text-shadow: 0 0 6px rgba(255, 255, 255, 0.8); }
        .ac-val { color: #ffffff; text-shadow: 0 0 6px rgba(255, 255, 255, 0.8); }
        .max-chain-val { color: #ffffff; text-shadow: 0 0 6px rgba(255, 255, 255, 0.8); }

        .side-act-btn {
            width: 100%; border: 2px solid #2121ff; border-radius: 8px; font-weight: 800; color: #ffffff; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
            box-shadow: 0 0 8px rgba(33, 33, 255, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.2);
            transition: transform 0.08s, background 0.15s; pointer-events: auto; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        }
        .side-act-btn:active { transform: scale(0.92); }
        .side-act-btn:disabled { opacity: 0.35; cursor: not-allowed; }

        .btn-reset { background: linear-gradient(180deg, #ff1a1a 0%, #990000 100%); padding: 8px 2px; font-size: 10px; border-color: #ff4d4d; }
        .btn-undo { background: linear-gradient(180deg, #ff00aa 0%, #880055 100%); padding: 10px 2px; font-size: 11px; font-weight: 900; border-color: #ff66cc; color: #ffffff; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8); }
        .gravity-control { width: 100%; gap: 3px; padding: 4px 2px; margin-bottom: 0; }
        .gravity-step-btn { width: 100%; height: 44px; border: 1px solid #00ffff; border-radius: 5px; background: linear-gradient(180deg, #00c3ff 0%, #005599 100%); color: #ffffff; font-size: 18px; font-weight: 900; cursor: pointer; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8); }
        .gravity-step-btn:active { transform: scale(0.92); }
        .gravity-step-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .gravity-level { color: #00ffff; font-size: 16px; font-weight: 900; line-height: 1.2; text-shadow: 0 0 4px rgba(0, 255, 255, 0.8); white-space: nowrap; }

        .board {
            position: relative; width: calc(var(--cell-size) * 6 + 10px); height: calc(var(--cell-size) * 13 + 10px);
            background: var(--field-bg); border: 5px solid #2121ff; border-radius: 12px;
            box-shadow: 0 0 20px rgba(33, 33, 255, 0.8), inset 0 0 15px rgba(0, 0, 0, 0.9); flex-shrink: 0; overflow: hidden; isolation: isolate;
        }

        .grid-layer { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(13, 1fr); pointer-events: none; z-index: 0; }
        .grid-cell { position: relative; }
        .grid-cell::before, .grid-cell::after { content: ""; position: absolute; background: rgba(33, 33, 255, 0.25); pointer-events: none; }
        .grid-cell::before { top: 0; right: -1px; bottom: 0; width: 2px; }
        .grid-cell::after { right: 0; bottom: -1px; left: 0; height: 2px; }
        .grid-cell:nth-child(6n)::before { display: none; }
        .grid-cell:nth-last-child(-n+6)::after { display: none; }

        .death-line {
            position: absolute; top: calc(var(--cell-size) * 1); left: 0; right: 0; height: 2px;
            display: grid; grid-template-columns: repeat(6, 1fr); pointer-events: none; z-index: -1;
        }
        .death-line-segment { border-top: 2px dashed #ff0000; box-shadow: 0 0 8px rgba(255, 0, 0, 0.9); }

        #puyoLayer { position: absolute; inset: 0; pointer-events: none; z-index: 2; }

        .puyo-item {
            position: absolute; width: var(--cell-size); height: var(--cell-size); padding: 0;
            will-change: left, top, transform; 
            transition: left 0.08s ease-out, top 0.08s linear, transform 0.12s cubic-bezier(0.2, 0.8, 0.2, 1); 
            z-index: 10;
        }
        
        .puyo-item.active-puyo { filter: drop-shadow(7.5px 7.5px 2.25px rgba(0, 0, 0, 0.3375)); transition: left 0.08s ease-out, transform 0.12s cubic-bezier(0.2, 0.8, 0.2, 1), filter 2s ease-out; }
        .puyo-item.active-puyo.puyo-landed { filter: none; }
        .puyo-item.falling { transition: top var(--fall-duration, 0.12s) cubic-bezier(0.25, 0.1, 0.25, 1), left 0.08s ease-out, transform 0.12s cubic-bezier(0.2, 0.8, 0.2, 1), filter 2s ease-out !important; }
        .puyo-item.ghost { opacity: 0.35; filter: saturate(0.6); z-index: 5; }
        .puyo-item.active-sub-puyo { z-index: 12; transition: left 0.08s ease-out, transform 0.12s cubic-bezier(0.2, 0.8, 0.2, 1), filter 2s ease-out; }

        .puyo-inner {
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; transform-origin: center center;
        }
        .puyo-item.puyo-pop { z-index: 20; }
        .puyo-pop > .puyo-inner {
            animation: puyoPopBody 0.8s ease-in forwards, puyoPopVanish 1ms linear calc(500ms + var(--burst-delay, 0ms)) forwards;
        }
        #puyoBurstLayer { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 15; }
        .puyo-burst-fragments { position: absolute; pointer-events: none; }
        .puyo-burst-fragment { position: absolute; top: 42%; left: 50%; width: 48%; height: 48%; opacity: 0; will-change: transform, opacity; }
        @keyframes puyoPopBody {
            0% { transform: scale(1); }
            20%, 100% { transform: scale(1.2); }
        }
        @keyframes puyoPopVanish { to { opacity: 0; } }
        .puyo-item.puyo-landing:not(.active-puyo) { transition: none !important; }
        .puyo-landing .puyo-inner { animation: jellyLandingAnim 0.3s cubic-bezier(0.25, 1, 0.5, 1); transform-origin: center bottom; }
        @keyframes jellyLandingAnim {
            0% { transform: scale(1, 1); } 30% { transform: scale(1.28, 0.72); } 60% { transform: scale(0.88, 1.12); } 85% { transform: scale(1.04, 0.96); } 100% { transform: scale(1, 1); }
        }

        .axis-glow { display: none; }
        .axis-puyo .axis-glow { display: block; animation: axisGlowAnim 0.3s infinite alternate ease-in-out; }
        @keyframes axisGlowAnim { 0% { opacity: 0.2; stroke-width: 1.5; filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.5)); } 100% { opacity: 1; stroke-width: 3.5; filter: drop-shadow(0 0 6px rgba(255, 255, 255, 1)); } }

        .chain-num-popup {
            position: absolute; transform: translate(-50%, -50%); font-size: clamp(28px, 5vh, 42px); font-weight: 900; color: #ffff00;
            text-shadow: 0 0 6px #000, 0 0 12px #2121ff, 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            z-index: 50; pointer-events: none; animation: floatChainNum 1.4s cubic-bezier(0.15, 0.85, 0.35, 1.2) forwards;
        }
        @keyframes floatChainNum { 0% { transform: translate(-50%, -20%) scale(0.5); opacity: 0; } 20% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } 80% { transform: translate(-50%, -70%) scale(1.0); opacity: 1; } 100% { transform: translate(-50%, -90%) scale(0.8); opacity: 0; } }

        .all-clear-popup {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: clamp(32px, 6vh, 48px); font-weight: 900; color: #ffff00;
            text-shadow: 0 0 10px #000, 0 0 20px #ff0000, 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            z-index: 55; pointer-events: none; white-space: nowrap; animation: popAllClear 1.0s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popAllClear { 0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; } 20% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; } 80% { transform: translate(-50%, -50%) scale(1.0); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0; } }

        .queue-preview-panel { position: relative; gap: 3px; overflow: hidden; background: var(--field-bg); backdrop-filter: none; }
        .queue-preview-slot { display: flex; flex-direction: column; align-items: center; width: 100%; }
        .queue-pair-window { width: 100%; overflow: hidden; }
        .queue-pair-window-next2 { width: 50%; align-self: flex-end; transform: translateX(6px); }
        .queue-pair { display: flex; flex-direction: column; align-items: center; gap: 1px; width: 100%; }
        .queue-pair-window-next2 .queue-pair { width: 200%; transform: translateX(calc(-50% + 23px)); }
        .queue-puyo-cell { width: calc(var(--cell-size) * 0.78); height: calc(var(--cell-size) * 0.78); flex: 0 0 auto; }
        .queue-puyo-jelly .puyo-inner { animation: jellyLandingAnim 0.3s cubic-bezier(0.25, 1, 0.5, 1); transform-origin: center bottom; }
        .queue-advancing .queue-pair-window { visibility: hidden; }
        .right-top { position: relative; }
        .queue-transition-layer { position: absolute; inset: 0; z-index: 4; overflow: visible; pointer-events: none; }
        .queue-transition-pair { position: absolute; display: flex; justify-content: center; overflow: hidden; will-change: transform, opacity, clip-path; }
        .queue-transition-pair .queue-pair { width: 100% !important; }

        .tap-guide-overlay { position: absolute; inset: 0; display: flex; pointer-events: none; z-index: 2; opacity: 0.1; }
        .tap-zone-left { width: 50%; height: 100%; border-right: 1px dashed rgba(255,255,255,0.3); }
        .tap-zone-right { width: 50%; height: 100%; }

        .game-over-mask {
            position: absolute; inset: 0; background: rgba(0, 0, 0, 0.92); backdrop-filter: blur(4px);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 60; border-radius: 8px; gap: 16px;
        }
        .game-over-mask.hidden { display: none; }
        .game-over-text { font-size: 24px; font-weight: 900; color: #ff0000; letter-spacing: 2px; text-shadow: 0 0 8px rgba(255, 0, 0, 0.8); }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card {
            background: #000000; border: 3px solid #2121ff; border-radius: 16px; padding: 20px; width: min(90%, 380px);
            box-shadow: 0 0 25px rgba(33, 33, 255, 0.8); display: flex; flex-direction: column; align-items: stretch; gap: 16px; transform: scale(0.9); transition: transform 0.2s;
        }
        .modal-card:focus { outline: none; }
        .modal-overlay.active .modal-card { transform: scale(1); }
        .modal-title {
            position: relative; display: flex; align-items: center; justify-content: center; min-height: 88px;
            margin: -8px 0 0; isolation: isolate;
        }
        .modal-title-text {
            position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; gap: 0;
            font-family: "Arial Rounded MT Bold", "Hiragino Maru Gothic ProN", "M PLUS Rounded 1c", "Yu Gothic", sans-serif;
            color: #ffff00; font-size: clamp(44px, 12vw, 58px); font-weight: 1000; line-height: 1;
            letter-spacing: -4px; white-space: nowrap; text-shadow: 0 0 10px rgba(255, 255, 0, 0.8);
        }
        .modal-title-text span {
            display: inline-block;
        }
        .modal-title-text span:nth-child(1) { transform: rotate(-12deg); }
        .modal-title-text span:nth-child(2) { transform: rotate(8deg); }
        .modal-title-text span:nth-child(3) { transform: rotate(-8deg); }
        .modal-title-text span:nth-child(4) { transform: rotate(12deg); }
        .modal-title-puyo {
            position: absolute; left: -7px; top: -8px; width: 86px; height: 86px;
            transform: rotate(-18deg); z-index: 1; pointer-events: none;
        }
        .modal-title-puyo-right { left: auto; right: -7px; transform: rotate(18deg); }
        .modal-title-puyo .puyo-inner { width: 100%; height: 100%; }
        .modal-title-puyo.puyo-landing .puyo-inner { animation: jellyLandingAnim 0.3s cubic-bezier(0.25, 1, 0.5, 1); transform-origin: center bottom; }
        .modal-btn-group { display: flex; flex-direction: column; gap: 8px; width: 100%; }
        .modal-choice-btn {
            width: 100%; min-height: 52px; padding: 12px 16px; border-radius: 10px; border: none; font-size: 15px; font-weight: 800; color: #ffffff; cursor: pointer; transition: transform 0.1s; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }
        .modal-choice-btn:active { transform: scale(0.96); }
        .btn-mode-3 { background: linear-gradient(135deg, #ff2a6d 0%, #990033 100%); border: 1px solid #ff6699; }
        .btn-mode-4 { background: linear-gradient(135deg, #ff8c00 0%, #b34700 100%); border: 1px solid #ffaa33; }
        .btn-mode-5 { background: linear-gradient(135deg, #990022 0%, #4a000e 100%); border: 1px solid #e62e5c; }
        
        .score-reset-section { display: flex; align-items: center; justify-content: flex-end; gap: 8px; width: 100%; min-height: 36px; }
        .score-reset-btn {
            position: relative; overflow: hidden; isolation: isolate; flex: 0 0 auto; width: 112px; min-height: 30px; padding: 4px 8px;
            border: 1px solid rgba(33, 33, 255, 0.6); border-radius: 7px; background: transparent; color: #00ffff;
            font-size: 10px; font-weight: 600; cursor: pointer;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }
        .score-reset-btn:active { background: rgba(33, 33, 255, 0.2); }
        .score-reset-progress { position: absolute; z-index: 0; inset: 0 auto 0 0; width: 0; background: #ffff00; opacity: 0.6; pointer-events: none; }
        .score-reset-label { position: relative; z-index: 1; pointer-events: none; }
        .score-reset-status { display: flex; flex: 0 0 20px; align-items: center; justify-content: center; min-width: 20px; min-height: 36px; color: #ffff00; font-size: 18px; font-weight: 900; text-align: center; }

        .modal-cancel-btn { align-self: center; min-width: 140px; min-height: 44px; background: transparent; border: 1px solid #2121ff; border-radius: 10px; color: #ffff00; font-size: 14px; font-weight: 800; cursor: pointer; padding: 10px 24px; }
        .modal-choice-btn:focus-visible, .modal-cancel-btn:focus-visible { outline: 3px solid #ffff00; outline-offset: 2px; }
        @media (max-height: 520px) {
            .modal-card { padding: 14px 18px; gap: 10px; }
            .modal-title { min-height: 70px; }
            .modal-title-text { font-size: 44px; }
            .modal-title-puyo { width: 70px; height: 70px; }
        }
        body.game-paused #boardContainer * { animation-play-state: paused !important; }
    </style>
</head>
<body class="game-paused">

    <div class="app-container">
        
        <div class="top-bar">
            <div class="panel-box score-box"><span class="panel-lbl">SCORE</span><span id="currScoreDisp" class="stat-val curr-val">0</span></div>
            <div class="panel-box score-box"><span class="panel-lbl">HI-SCORE</span><span id="maxScoreDisp" class="stat-val curr-val">0</span></div>
        </div>

        <div class="stage-area">
            <div class="left-panel">
                <button id="pauseButton" class="side-act-btn btn-reset" onclick="openResetModal()"><span style="font-size: 12px;">■</span><span>停止</span></button>
                <button id="undoBtn" class="side-act-btn btn-undo" onclick="undo()"><span style="font-size: 13px;">◀︎</span><span>戻す</span></button>
                <div class="panel-box gravity-control" aria-label="ぷよの自動落下速度">
                    <span class="panel-lbl">落下</span>
                    <button id="gravityUpBtn" class="gravity-step-btn" type="button" aria-label="落下速度を下げる" onclick="changeGravityLevel(-1)">▲</button>
                    <output id="gravityLevelDisp" class="gravity-level" aria-live="polite">OFF</output>
                    <button id="gravityDownBtn" class="gravity-step-btn" type="button" aria-label="落下速度を上げる" onclick="changeGravityLevel(1)">▼</button>
                </div>
            </div>

            <div id="boardContainer" class="board">
                <div class="tap-guide-overlay"><div class="tap-zone-left"></div><div class="tap-zone-right"></div></div>
                <div class="grid-layer" id="gridBg"></div>
                <div class="death-line"><span class="death-line-segment"></span><span class="death-line-segment"></span><span class="death-line-segment"></span><span class="death-line-segment"></span><span class="death-line-segment"></span><span class="death-line-segment"></span></div>
                <div id="puyoLayer"></div>
                <div id="gameOverMask" class="game-over-mask hidden">
                    <div class="game-over-text">ばたんきゅ〜</div>
                    <button class="side-act-btn btn-reset" style="padding: 10px 20px; font-size: 14px; width: auto;" onclick="openResetModal()">やり直す</button>
                </div>
            </div>

            <div class="right-panel">
                <div class="right-top">
                    <div id="queuePreview" class="panel-box queue-preview-panel">
                        <div class="queue-preview-slot">
                            <div id="next1Window" class="queue-pair-window">
                                <div id="next1Pair" class="queue-pair"><div id="next1Sub" class="queue-puyo-cell"></div><div id="next1Main" class="queue-puyo-cell"></div></div>
                            </div>
                        </div>
                        <div class="queue-preview-slot">
                            <div id="next2Window" class="queue-pair-window queue-pair-window-next2">
                                <div id="next2Pair" class="queue-pair"><div id="next2Sub" class="queue-puyo-cell"></div><div id="next2Main" class="queue-puyo-cell"></div></div>
                            </div>
                        </div>
                    </div>
                    <div class="panel-box"><span class="panel-lbl">ぷよ消し数</span><span id="totalPoppedDisp" class="stat-val curr-val">0</span></div>
                    <div class="panel-box"><span class="panel-lbl">全消し数</span><span id="maxAllClearDisp" class="stat-val ac-val">0</span></div>
                    <div class="panel-box"><span class="panel-lbl">最大連鎖</span><span id="maxChainDisp" class="stat-val max-chain-val">0</span></div>
                </div>
            </div>
        </div>
    </div>

    <div id="puyoBurstLayer" aria-hidden="true"></div>

    <div id="resetModal" class="modal-overlay active" aria-hidden="false">
        <div class="modal-card" role="dialog" aria-modal="true" aria-label="ゲーム設定" tabindex="-1">
            <header class="modal-title">
                <div id="modalTitlePuyo" class="modal-title-puyo" aria-hidden="true"></div>
                <div id="modalTitlePuyoRight" class="modal-title-puyo modal-title-puyo-right" aria-hidden="true"></div>
                <div class="modal-title-text" aria-label="ぷよれん">
                    <span>ぷ</span><span>よ</span><span>れ</span><span>ん</span>
                </div>
            </header>
            <div class="modal-btn-group">
                <button class="modal-choice-btn btn-mode-3" onclick="confirmReset(3)">甘口（3色）で開始</button>
                <button class="modal-choice-btn btn-mode-4" onclick="confirmReset(4)">中辛（4色）で開始</button>
                <button class="modal-choice-btn btn-mode-5" onclick="confirmReset(5)">辛口（5色）で開始</button>
            </div>

            <button class="modal-cancel-btn" onclick="closeResetModal()">つづき</button>
            <section class="score-reset-section">
                <div id="scoreResetStatus" class="score-reset-status" aria-live="polite"></div>
                <button id="scoreResetBtn" class="score-reset-btn" type="button" aria-pressed="false" aria-label="スコアリセット。5秒間長押し">
                    <span class="score-reset-progress" aria-hidden="true"></span>
                    <span class="score-reset-label">⚙スコアリセット</span>
                </button>
            </section>
        </div>
    </div>

    <script>
        const COLS = 6;
        const ROWS = 13; 
        const SAVE_STORAGE_KEY = 'PUYO_CHAIN_PRACTICE_RESUME_DATA';
        const LOCK_DELAY_MS = 530;
        const SCORE_RESET_HOLD_MS = 5000;
        const DROP_STEP_DURATION_MS = 16;
        const GRAVITY_INTERVALS = [0, 1200, 530, 270, 110, 60];

        const MASTER_PUYO_THEMES = {
            1: { base: '#ff1744', stroke: '#880015' }, 2: { base: '#0088ff', stroke: '#003299' }, 
            3: { base: '#00c853', stroke: '#004d1a' }, 4: { base: '#ffd600', stroke: '#7c5900' }, 5: { base: '#d500f9', stroke: '#500075' }  
        };

        const ROTATIONS = [{ dx: 0, dy: -1 }, { dx: 1, dy: 0 }, { dx: 0, dy: 1 }, { dx: -1, dy: 0 }];
        const CHAIN_BONUS_TABLE = [0, 0, 8, 16, 32, 64, 96, 128, 160, 192, 224, 256, 288, 320, 352, 384, 416, 448, 480, 512];
        
        const SWIPE_UP_RATIO = 0.15;
        const SWIPE_DROP_RATIO = 0.06;
        const SWIPE_LEFTRIGHT_RATIO = 0.06;

        const SWIPE_UP_AXIS_RATIO = 0.45;
        const SWIPE_DOWN_AXIS_RATIO = 1.0;
        const ALL_CLEAR_SCORE_BONUS = 2100;

        function getChainBonus(chain) { if (chain <= 1) return 0; if (chain < CHAIN_BONUS_TABLE.length) return CHAIN_BONUS_TABLE[chain]; return 512; }
        function getConnectBonus(count) { if (count <= 4) return 0; if (count <= 10) return count - 3; return 10; }
        function getColorBonus(colorCount) { if (colorCount <= 1) return 0; if (colorCount === 2) return 3; if (colorCount === 3) return 6; if (colorCount === 4) return 10; return 15; }
        function triggerVibration(pattern) { if (typeof navigator !== 'undefined' && navigator.vibrate) { try { navigator.vibrate(pattern); } catch (e) {} } }
        let isPaused = true, gameSessionId = 0;
        const activeDelays = new Set();
        let pausedBoardAnimations = [];
        let pausedBurstAnimations = [];
        let pausedLockDelayRemaining = null;
        let scoreResetHoldStartedAt = null;
        let scoreResetHoldFrame = null;
        let modalTitlePuyoTimer = null;
        let modalTitlePuyoRightTimer = null;
        let pendingQueueAdvance = null;
        let queueAdvanceCleanupTimer = null;
        const queuePuyoJellyTimers = new Map();

        function sleep(ms) {
            return new Promise(resolve => {
                const delay = {
                    remaining: ms,
                    startedAt: 0,
                    timerId: null,
                    start() {
                        if (isPaused || this.timerId !== null) return;
                        this.startedAt = performance.now();
                        this.timerId = setTimeout(() => {
                            this.timerId = null;
                            activeDelays.delete(this);
                            resolve();
                        }, this.remaining);
                    },
                    pause() {
                        if (this.timerId === null) return;
                        clearTimeout(this.timerId);
                        this.timerId = null;
                        this.remaining = Math.max(0, this.remaining - (performance.now() - this.startedAt));
                    }
                };
                if (ms <= 0) {
                    resolve();
                    return;
                }
                activeDelays.add(delay);
                delay.start();
            });
        }

        let activeColorPalette = [], board = [], puyoQueue = [], activePiece = null, historyStack = [];
        let maxChainCount = 0, currentAllClearCount = 0, maxAllClearCount = 0, totalPoppedCount = 0, currentScore = 0, maxScore = 0;
        let currentColorCount = 4, isAnimating = false, isDropping = false, isGameOver = false, nextPuyoId = 1, unconnectedIds = new Set();
        
        let gravityLevel = 0, gravityEnabled = false, gravityInterval = 1500;
        let gravityRAF = null, lastTime = null;

        function updateGravityControl() {
            document.getElementById('gravityLevelDisp').textContent = gravityLevel === 0 ? 'OFF' : `${gravityLevel}速`;
            document.getElementById('gravityUpBtn').disabled = gravityLevel === 0;
            document.getElementById('gravityDownBtn').disabled = gravityLevel === GRAVITY_INTERVALS.length - 1;
        }

        function changeGravityLevel(step) {
            if (isPaused) return;
            gravityLevel = Math.max(0, Math.min(GRAVITY_INTERVALS.length - 1, gravityLevel + step));
            gravityEnabled = gravityLevel > 0;
            if (gravityEnabled) gravityInterval = GRAVITY_INTERVALS[gravityLevel];
            stopGravity();
            if ((gravityEnabled || activePiece?.isLanded) && activePiece && !isGameOver && !isAnimating) startGravity();
            updateGravityControl();
            render();
            saveResumeData();
        }

        function gravityLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const delta = timestamp - lastTime;
            lastTime = timestamp;

            if (gravityEnabled && !isGameOver && !isAnimating && activePiece) {
                activePiece.fallProgress = (activePiece.fallProgress || 0) + (delta / gravityInterval);
                
                if (activePiece.fallProgress >= 1) {
                    let steps = Math.floor(activePiece.fallProgress);
                    activePiece.fallProgress -= steps;
                    for (let i = 0; i < steps; i++) {
                        if (canPlacePiece({ ...activePiece, y: activePiece.y + 1 })) {
                            activePiece.y++;
                        } else {
                            activePiece.fallProgress = 0;
                            break;
                        }
                    }
                }
            }

            if (activePiece && !isGameOver && !isAnimating) {
                const now = Date.now();
                updateLandingState(now);
                lockPieceIfReady(now);
            }

            if (!isAnimating) render();
            if ((gravityEnabled || activePiece?.isLanded) && !isGameOver && !isAnimating && activePiece) {
                gravityRAF = requestAnimationFrame(gravityLoop);
            } else {
                gravityRAF = null;
            }
        }

        function startGravity() {
            stopGravity();
            if (!isPaused && (gravityEnabled || activePiece?.isLanded) && !isGameOver && !isAnimating && activePiece) {
                lastTime = null;
                gravityRAF = requestAnimationFrame(gravityLoop);
            }
        }

        function stopGravity() {
            if (gravityRAF) { cancelAnimationFrame(gravityRAF); gravityRAF = null; }
        }

        function saveResumeData() {
            try {
                const data = { board, puyoQueue, activeColorPalette, currentColorCount, currentScore, maxScore, totalPoppedCount, maxAllClearCount, currentAllClearCount, maxChainCount, nextPuyoId, isGameOver, activePiece: activePiece ? { ...activePiece } : null, gravityLevel, gravityEnabled, gravityInterval };
                localStorage.setItem(SAVE_STORAGE_KEY, JSON.stringify(data));
            } catch (e) {}
        }

        function loadResumeData() {
            try {
                const json = localStorage.getItem(SAVE_STORAGE_KEY); if (!json) return false;
                const data = JSON.parse(json); if (!data || !data.board) return false;
                board = data.board; puyoQueue = data.puyoQueue || []; currentColorCount = data.currentColorCount || 4;
                if (Array.isArray(data.activeColorPalette) && data.activeColorPalette.length === currentColorCount) { activeColorPalette = [...data.activeColorPalette]; } else { pickColorPalette(); }
                currentScore = data.currentScore || 0; maxScore = data.maxScore || 0; totalPoppedCount = data.totalPoppedCount || 0; maxAllClearCount = data.maxAllClearCount || 0; currentAllClearCount = data.currentAllClearCount || 0; maxChainCount = data.maxChainCount || 0; nextPuyoId = data.nextPuyoId || 1; isGameOver = !!data.isGameOver; 
                activePiece = data.activePiece ? { ...data.activePiece, rot: data.activePiece.rot || 0, angle: data.activePiece.angle || 0, fallProgress: data.activePiece.fallProgress || 0 } : null;
                if (activePiece) {
                    activePiece.landedAt = activePiece.isLanded ? Date.now() : null;
                    activePiece.isLanding = false;
                }
                if (Number.isInteger(data.gravityLevel) && data.gravityLevel >= 0 && data.gravityLevel < GRAVITY_INTERVALS.length) {
                    gravityLevel = data.gravityLevel;
                } else if (data.gravityEnabled) {
                    const legacyLevel = [1500, 1000, 530, 400, 270].indexOf(Number(data.gravityInterval));
                    gravityLevel = legacyLevel === -1 ? 1 : legacyLevel + 1;
                } else {
                    gravityLevel = 0;
                }
                gravityEnabled = gravityLevel > 0;
                gravityInterval = gravityEnabled ? GRAVITY_INTERVALS[gravityLevel] : 1500;
                updateGravityControl();
                historyStack = []; unconnectedIds.clear(); isAnimating = false; isDropping = false; initGrid(); document.getElementById('puyoLayer').innerHTML = ''; clearPuyoBurstEffects(); updateStatsUI(); updateUndoBtn();
                updatePupilDirections();
                if (isGameOver) { document.getElementById('gameOverMask').classList.remove('hidden'); } else { document.getElementById('gameOverMask').classList.add('hidden'); if (!activePiece) spawnPiece(); }
                render(); return true;
            } catch (e) { return false; }
        }

        function createPuyoConnectionMarkup(colorIndex, conn) {
            const theme = MASTER_PUYO_THEMES[colorIndex];
            if (!theme) return '';
            const seamOverlap = 1.2;
            let connFill = "", connOutline = "";
            if (conn.r) connFill += `<rect x="20" y="14" width="${25 + seamOverlap}" height="24" fill="${theme.base}" />`;
            if (conn.l) connFill += `<rect x="${-seamOverlap}" y="14" width="${25 + seamOverlap}" height="24" fill="${theme.base}" />`;
            if (conn.b) connFill += `<rect x="7.5" y="20" width="30" height="${25 + seamOverlap}" fill="${theme.base}" />`;
            if (conn.t) connFill += `<rect x="7.5" y="${-seamOverlap}" width="30" height="${25 + seamOverlap}" fill="${theme.base}" />`;
            if (conn.r) connOutline += `<path d="M 37.5 13.123 H ${45 + seamOverlap} M 37.5 37.87 H ${45 + seamOverlap}" fill="none" stroke="${theme.stroke}" stroke-width="2.5" stroke-linecap="butt" />`;
            if (conn.l) connOutline += `<path d="M ${-seamOverlap} 13.123 H 7.5 M ${-seamOverlap} 37.87 H 7.5" fill="none" stroke="${theme.stroke}" stroke-width="2.5" stroke-linecap="butt" />`;
            if (conn.b) connOutline += `<path d="M 7.5 37.87 V ${45 + seamOverlap} M 37.5 37.87 V ${45 + seamOverlap}" fill="none" stroke="${theme.stroke}" stroke-width="2.5" stroke-linecap="butt" />`;
            if (conn.t) connOutline += `<path d="M 7.5 ${-seamOverlap} V 13.123 M 37.5 ${-seamOverlap} V 13.123" fill="none" stroke="${theme.stroke}" stroke-width="2.5" stroke-linecap="butt" />`;
            return `${connFill}${connOutline}`;
        }

        function createPuyoSVG(colorIndex, isGhost = false, conn = {t:0, r:0, b:0, l:0}, pupilOffsets = null, isBurst = false) {
            if (!colorIndex || !MASTER_PUYO_THEMES[colorIndex]) return '';
            const theme = MASTER_PUYO_THEMES[colorIndex];
            const pupils = pupilOffsets || [{ x: 0, y: 0 }, { x: 0, y: 0 }];
            const centeredEyesHTML = `<circle cx="15.5" cy="25" r="6" fill="#ffffff" stroke="${theme.stroke}" stroke-width="1.5" /><circle cx="29.5" cy="25" r="6" fill="#ffffff" stroke="${theme.stroke}" stroke-width="1.5" /><circle cx="15.5" cy="25" r="2" fill="#0f172a" transform="translate(${pupils[0]?.x || 0} ${pupils[0]?.y || 0})" /><circle cx="29.5" cy="25" r="2" fill="#0f172a" transform="translate(${pupils[1]?.x || 0} ${pupils[1]?.y || 0})" />`;
            const highlightHTML = `<ellipse cx="12" cy="14" rx="6" ry="3" fill="#ffffff" opacity="0.6" transform="rotate(-25 12 14)" />`;
            const baseShapePath = isBurst
                ? "M 22.5 2 A 20.5 20.5 0 1 1 22.5 43 A 20.5 20.5 0 1 1 22.5 2 Z"
                : "M 22.5 7 C 12 7, 4 14, 2.5 23 C 1 34, 7 42, 22.5 42 C 38 42, 44 34, 42.5 23 C 41 14, 33 7, 22.5 7 Z";
            const connectionHTML = createPuyoConnectionMarkup(colorIndex, conn);
            return `<div class="puyo-inner"><svg viewBox="0 0 45 45" style="width:100%; height:100%; display:block; overflow:visible;"><path d="${baseShapePath}" fill="${theme.base}" stroke="${theme.stroke}" stroke-width="2.5" stroke-linejoin="round" /><g class="puyo-connection">${connectionHTML}</g>${highlightHTML}${isGhost ? '' : centeredEyesHTML}<path d="${baseShapePath}" fill="none" stroke="#ffffff" class="axis-glow" transform="scale(1.05) translate(-1.1, -1.1)" /></svg></div>`;
        }

        function initGrid() { const gridBg = document.getElementById('gridBg'); gridBg.innerHTML = ''; for (let i = 0; i < ROWS * COLS; i++) { const cell = document.createElement('div'); cell.className = 'grid-cell'; gridBg.appendChild(cell); } }
        function initBoard() { board = Array.from({ length: ROWS }, () => Array(COLS).fill(null)); initGrid(); }
        function pickColorPalette() { const allColors = [1, 2, 3, 4, 5]; if (currentColorCount === 5) { activeColorPalette = allColors; } else { activeColorPalette = [...allColors].sort(() => Math.random() - 0.5).slice(0, currentColorCount); } }
        function generatePiece() { return { main: activeColorPalette[Math.floor(Math.random() * activeColorPalette.length)], sub: activeColorPalette[Math.floor(Math.random() * activeColorPalette.length)] }; }
        function refillQueue() { while (puyoQueue.length < 3) puyoQueue.push(generatePiece()); }

        function clearQueueAdvanceAnimation() {
            if (queueAdvanceCleanupTimer !== null) clearTimeout(queueAdvanceCleanupTimer);
            queueAdvanceCleanupTimer = null;
            if (!pendingQueueAdvance) return;
            pendingQueueAdvance.animations.forEach(animation => animation.cancel());
            pendingQueueAdvance.layer.remove();
            pendingQueueAdvance.panel.classList.remove('queue-advancing');
            pendingQueueAdvance = null;
        }

        function createQueueTransitionPair(sourcePair, container, layer, width) {
            const containerRect = container.getBoundingClientRect();
            const sourceCellRect = sourcePair.querySelector('.queue-puyo-cell').getBoundingClientRect();
            const wrapper = document.createElement('div');
            wrapper.className = 'queue-transition-pair';
            wrapper.style.left = `${sourceCellRect.left + sourceCellRect.width / 2 - containerRect.left - width / 2}px`;
            wrapper.style.top = `${sourcePair.getBoundingClientRect().top - containerRect.top}px`;
            wrapper.style.width = `${width}px`;
            wrapper.style.height = `${sourcePair.getBoundingClientRect().height}px`;
            const pair = sourcePair.cloneNode(true);
            pair.removeAttribute('id');
            pair.style.width = '100%';
            pair.style.transform = 'none';
            pair.querySelectorAll('[id]').forEach(element => element.removeAttribute('id'));
            pair.querySelectorAll('.queue-puyo-jelly').forEach(element => element.classList.remove('queue-puyo-jelly'));
            wrapper.appendChild(pair);
            layer.appendChild(wrapper);
            return { wrapper, centerX: sourceCellRect.left + sourceCellRect.width / 2 };
        }

        function beginQueueAdvance() {
            clearQueueAdvanceAnimation();
            if (puyoQueue.length < 2) return;
            const nextPair = document.getElementById('next1Pair');
            const next2Pair = document.getElementById('next2Pair');
            if (nextPair.dataset.queueState !== `${puyoQueue[0].main}_${puyoQueue[0].sub}` ||
                next2Pair.dataset.queueState !== `${puyoQueue[1].main}_${puyoQueue[1].sub}`) return;

            const panel = document.getElementById('queuePreview');
            const nextWindow = document.getElementById('next1Window');
            const width = nextWindow.getBoundingClientRect().width;
            const layer = document.createElement('div');
            layer.className = 'queue-transition-layer';
            panel.classList.add('queue-advancing');
            panel.appendChild(layer);

            const outgoing = createQueueTransitionPair(nextPair, panel, layer, width);
            const movingNext2 = createQueueTransitionPair(next2Pair, panel, layer, width);
            const targetRect = nextWindow.getBoundingClientRect();
            const targetY = targetRect.top - next2Pair.getBoundingClientRect().top;
            const targetX = targetRect.left + targetRect.width / 2 - movingNext2.centerX;
            const duration = 320;
            const animations = [
                outgoing.wrapper.animate([
                    { transform: 'translateY(0)', opacity: 1 },
                    { transform: `translateY(-${outgoing.wrapper.getBoundingClientRect().height + 8}px)`, opacity: 0 }
                ], { duration, easing: 'ease-in', fill: 'forwards' }),
                movingNext2.wrapper.animate([
                    { transform: 'translate(0, 0)' },
                    { transform: `translate(${targetX}px, ${targetY}px)` }
                ], { duration, easing: 'ease-in-out', fill: 'forwards' })
            ];
            pendingQueueAdvance = { panel, layer, animations, completed: false };
        }

        function completeQueueAdvance() {
            const transition = pendingQueueAdvance;
            if (!transition || transition.completed) return;
            transition.completed = true;
            const next2Pair = document.getElementById('next2Pair');
            const width = document.getElementById('next1Window').getBoundingClientRect().width;
            const entering = createQueueTransitionPair(next2Pair, transition.layer.parentElement, transition.layer, width);
            transition.animations.push(entering.wrapper.animate([
                { transform: `translateX(${width / 2}px)`, clipPath: 'inset(0 50% 0 0)' },
                { transform: 'translateX(0)', clipPath: 'inset(0 50% 0 0)' }
            ], { duration: 320, easing: 'ease-out', fill: 'forwards' }));
            queueAdvanceCleanupTimer = setTimeout(() => clearQueueAdvanceAnimation(), 360);
        }

        function scheduleQueuePuyoJelly(id) {
            const puyo = document.getElementById(id);
            if (!puyo) return;
            const timer = setTimeout(() => {
                puyo.classList.remove('queue-puyo-jelly');
                void puyo.offsetWidth;
                puyo.classList.add('queue-puyo-jelly');
                const settleTimer = setTimeout(() => {
                    puyo.classList.remove('queue-puyo-jelly');
                    scheduleQueuePuyoJelly(id);
                }, 300);
                queuePuyoJellyTimers.set(id, settleTimer);
            }, 1000 + Math.random() * 2000);
            queuePuyoJellyTimers.set(id, timer);
        }

        function startQueuePuyoJellyAnimations() {
            ['next1Sub', 'next1Main', 'next2Sub', 'next2Main'].forEach(id => {
                if (!queuePuyoJellyTimers.has(id)) scheduleQueuePuyoJelly(id);
            });
        }

        function pauseGame() {
            if (isPaused) {
                stopGravity();
                if (activePiece?.landedAt !== null && activePiece?.landedAt !== undefined && pausedLockDelayRemaining === null) {
                    pausedLockDelayRemaining = Math.max(0, LOCK_DELAY_MS - (Date.now() - activePiece.landedAt));
                }
                return;
            }
            isPaused = true;
            document.body.classList.add('game-paused');
            stopGravity();
            if (activePiece?.landedAt !== null && activePiece?.landedAt !== undefined) {
                pausedLockDelayRemaining = Math.max(0, LOCK_DELAY_MS - (Date.now() - activePiece.landedAt));
            }
            activeDelays.forEach(delay => delay.pause());
            pausedBoardAnimations = document.getElementById('boardContainer').getAnimations({ subtree: true })
                .filter(animation => animation.playState !== 'finished' && animation.playState !== 'idle');
            pausedBoardAnimations.forEach(animation => animation.pause());
            pausedBurstAnimations = document.getElementById('puyoBurstLayer').getAnimations({ subtree: true })
                .filter(animation => animation.playState !== 'finished' && animation.playState !== 'idle');
            pausedBurstAnimations.forEach(animation => animation.pause());
        }

        function resumeGame() {
            isPaused = false;
            document.body.classList.remove('game-paused');
            if (pausedLockDelayRemaining !== null && activePiece?.isLanded) {
                activePiece.landedAt = Date.now() - (LOCK_DELAY_MS - pausedLockDelayRemaining);
            }
            pausedLockDelayRemaining = null;
            activeDelays.forEach(delay => delay.start());
            pausedBoardAnimations.forEach(animation => {
                if (animation.playState === 'paused') animation.play();
            });
            pausedBoardAnimations = [];
            pausedBurstAnimations.forEach(animation => {
                if (animation.playState === 'paused') animation.play();
            });
            pausedBurstAnimations = [];
            if (!isAnimating && activePiece && !isGameOver) startGravity();
        }

        function clearPuyoBurstEffects() {
            const burstLayer = document.getElementById('puyoBurstLayer');
            burstLayer.getAnimations({ subtree: true }).forEach(animation => animation.cancel());
            burstLayer.replaceChildren();
        }

        function openResetModal() {
            const modal = document.getElementById('resetModal');
            modal.classList.add('active');
            modal.setAttribute('aria-hidden', 'false');
            startModalTitlePuyoAnimation();
            pauseGame();
            stopGravity();
            saveResumeData();
            modal.querySelector('.modal-card').focus({ preventScroll: true });
        }

        function closeResetModal() {
            const modal = document.getElementById('resetModal');
            modal.classList.remove('active');
            modal.setAttribute('aria-hidden', 'true');
            stopModalTitlePuyoAnimation();
            document.getElementById('scoreResetStatus').textContent = '';
            resumeGame();
            document.getElementById('pauseButton').focus();
        }

        function startModalTitlePuyoAnimation() {
            stopModalTitlePuyoAnimation();
            const schedulePuyoAnimation = (puyoId, setTimer) => {
                const titlePuyo = document.getElementById(puyoId);
                const color = 1 + Math.floor(Math.random() * Object.keys(MASTER_PUYO_THEMES).length);
                titlePuyo.innerHTML = createPuyoSVG(color);
                const animateAndSchedule = () => {
                    if (!document.getElementById('resetModal').classList.contains('active')) return;
                    titlePuyo.classList.remove('puyo-landing');
                    void titlePuyo.offsetWidth;
                    titlePuyo.classList.add('puyo-landing');
                    setTimer(setTimeout(animateAndSchedule, 3000 + Math.random() * 2000));
                };
                setTimer(setTimeout(animateAndSchedule, 3000 + Math.random() * 2000));
            };
            schedulePuyoAnimation('modalTitlePuyo', timer => { modalTitlePuyoTimer = timer; });
            schedulePuyoAnimation('modalTitlePuyoRight', timer => { modalTitlePuyoRightTimer = timer; });
        }

        function stopModalTitlePuyoAnimation() {
            for (const timer of [modalTitlePuyoTimer, modalTitlePuyoRightTimer]) {
                if (timer !== null) clearTimeout(timer);
            }
            modalTitlePuyoTimer = null;
            modalTitlePuyoRightTimer = null;
            document.querySelectorAll('.modal-title-puyo').forEach(puyo => puyo.classList.remove('puyo-landing'));
        }
        
        function confirmReset(selectedColors) {
            currentColorCount = selectedColors;
            startGame();
            closeResetModal();
        }

        function startGame() {
            gameSessionId++;
            clearQueueAdvanceAnimation();
            pickColorPalette(); initBoard(); document.getElementById('puyoLayer').innerHTML = ''; clearPuyoBurstEffects();
            puyoQueue = []; historyStack = []; unconnectedIds.clear(); isGameOver = false; isAnimating = false; isDropping = false; lastRotateFailedState = null;
            currentAllClearCount = 0; totalPoppedCount = 0; currentScore = 0;
            updateStatsUI(); document.getElementById('gameOverMask').classList.add('hidden'); updateUndoBtn(); refillQueue(); spawnPiece(); render();
        }

        function updateScoreResetProgress(timestamp) {
            if (scoreResetHoldStartedAt === null) return;
            const elapsed = timestamp - scoreResetHoldStartedAt;
            const progress = Math.min(1, elapsed / SCORE_RESET_HOLD_MS);
            const button = document.getElementById('scoreResetBtn');
            button.querySelector('.score-reset-progress').style.width = `${progress * 100}%`;

            if (progress >= 1) {
                scoreResetHoldStartedAt = null;
                scoreResetHoldFrame = null;
                button.classList.remove('holding');
                button.setAttribute('aria-pressed', 'false');
                button.querySelector('.score-reset-progress').style.width = '0';
                maxScore = 0;
                maxChainCount = 0;
                maxAllClearCount = 0;
                currentScore = 0;
                currentAllClearCount = 0;
                totalPoppedCount = 0;
                updateStatsUI();
                saveResumeData();
                document.getElementById('scoreResetStatus').textContent = '✔︎';
                return;
            }
            scoreResetHoldFrame = requestAnimationFrame(updateScoreResetProgress);
        }

        function startScoreResetHold() {
            if (scoreResetHoldStartedAt !== null) return;
            scoreResetHoldStartedAt = performance.now();
            const button = document.getElementById('scoreResetBtn');

        function findMatches() {

        function animatePuyoBurst(fragment, direction, delayOffset = 0) {
            const randomBetween = (min, max) => min + Math.random() * (max - min);
            const endX = direction * randomBetween(150, 520), endY = randomBetween(-180, 220);
            const sideSway = randomBetween(-150, 150), arcHeight = randomBetween(260, 480);
            const startScale = randomBetween(0.5, 0.8), endScale = randomBetween(0.08, 0.2);
            const shrinkExponent = randomBetween(1.1, 2.4), fragmentBaseScale = 0.48;
            const keyframes = Array.from({ length: 61 }, (_, index) => {
                const progress = index / 60;

                const y = endY * progress - 4 * arcHeight * progress * (1 - progress);
                const scale = (startScale - (startScale - endScale) * Math.pow(progress, shrinkExponent)) / fragmentBaseScale;
                const opacity = progress < 0.88 ? 1 : 1 - (progress - 0.88) / 0.12;
                return {

                            if (y > 0 && board[y-1][x] && board[y-1][x].color === item.color && !(board[y-1][x].isPopping && board[y-1][x].burstFinished) && !unconnectedIds.has(board[y-1][x].id)) conn.t = 1;
                            if (y < ROWS-1 && board[y+1][x] && board[y+1][x].color === item.color && !(board[y+1][x].isPopping && board[y+1][x].burstFinished) && !unconnectedIds.has(board[y+1][x].id)) conn.b = 1;
                            if (x > 0 && board[y][x-1] && board[y][x-1].color === item.color && !(board[y][x-1].isPopping && board[y][x-1].burstFinished) && !unconnectedIds.has(board[y][x-1].id)) conn.l = 1;
                            if (x < COLS-1 && board[y][x+1] && board[y][x+1].color === item.color && !(board[y][x+1].isPopping && board[y][x+1].burstFinished) && !unconnectedIds.has(board[y][x+1].id)) conn.r = 1;
                        }
                        let connStr = `${conn.t}${conn.r}${conn.b}${conn.l}`;
                        let el = document.getElementById(domId); if (!el) { el = document.createElement('div'); el.id = domId; el.className = 'puyo-item'; layer.appendChild(el); }
                        const pupilState = JSON.stringify(item.pupilOffsets || [{ x: 0, y: 0 }, { x: 0, y: 0 }]);
                        if (!el.hasAttribute('data-conn')) {
                            el.innerHTML = createPuyoSVG(item.color, false, conn, item.pupilOffsets);
                            el.setAttribute('data-conn', connStr);
                            el.setAttribute('data-pupils', pupilState);
                        } else if (item.isPopping) {
                            if (el.getAttribute('data-conn') !== connStr) {
                                const connection = el.querySelector('.puyo-connection');
                                if (connection) connection.innerHTML = createPuyoConnectionMarkup(item.color, conn);
                                el.setAttribute('data-conn', connStr);
                            }
                            if (el.getAttribute('data-pupils') !== pupilState) {
                                const pupils = item.pupilOffsets || [{ x: 0, y: 0 }, { x: 0, y: 0 }];
                                el.querySelectorAll('circle[fill="#0f172a"]').forEach((pupil, index) => {
                                    pupil.setAttribute('transform', `translate(${pupils[index]?.x || 0} ${pupils[index]?.y || 0})`);
                                });
                                el.setAttribute('data-pupils', pupilState);
                            }
                        } else if (el.getAttribute('data-conn') !== connStr || el.getAttribute('data-pupils') !== pupilState) {
                            el.innerHTML = createPuyoSVG(item.color, false, conn, item.pupilOffsets);
                            el.setAttribute('data-conn', connStr);
                            el.setAttribute('data-pupils', pupilState);
                        }
                        el.className = 'puyo-item' + (isFalling ? ' falling' : ''); el.style.left = `calc(var(--cell-size) * ${x})`; el.style.top = `calc(var(--cell-size) * ${y})`; el.style.transform = 'none';
                        if (item.isPopping) el.style.setProperty('--burst-delay', `${item.burstDelay || 0}ms`);
                        else el.style.removeProperty('--burst-delay');
                        if (item.isPopping) {
                            el.classList.add('puyo-pop');
                            const burstId = `puyo-burst-${item.id}`;
                            if (!document.getElementById(burstId)) {
                                const bounds = el.getBoundingClientRect();
                                const fragments = document.createElement('div');
                                fragments.className = 'puyo-burst-fragments';
                                fragments.id = burstId;
                                fragments.setAttribute('aria-hidden', 'true');
                                fragments.style.left = `${bounds.left}px`;
                                fragments.style.top = `${bounds.top}px`;
                                fragments.style.width = `${bounds.width}px`;
                                fragments.style.height = `${bounds.height}px`;
                                [-1, 1].forEach(direction => {
                                    const fragment = document.createElement('div');
                                    fragment.className = 'puyo-burst-fragment';
                                    fragment.innerHTML = createPuyoSVG(item.color, true, undefined, undefined, true);
                                    fragments.appendChild(fragment);
                                    animatePuyoBurst(fragment, direction, item.burstDelay);
                                });
                                const burstLayer = document.getElementById('puyoBurstLayer');
                                burstLayer.appendChild(fragments);
                                finishPuyoBurstAfterDelay(item.id, 445 + (item.burstDelay || 0), gameSessionId);
                                Promise.allSettled(Array.from(fragments.querySelectorAll('.puyo-burst-fragment'))
                                    .flatMap(fragment => fragment.getAnimations().map(animation => animation.finished)))
                                    .then(() => fragments.remove());
                            }
                        } else {
                            document.getElementById(`puyo-burst-${item.id}`)?.remove();
                        }
                        if (item.isLanding) el.classList.add('puyo-landing'); else el.classList.remove('puyo-landing');
                    }
                }
            }

            if (activePiece) {
                let activeConnMain = { t:0, r:0, b:0, l:0 }, activeConnSub = { t:0, r:0, b:0, l:0 };
                
                let fp = 0;
                if (!isAnimating && gravityEnabled) {
                    fp = activePiece.fallProgress || 0;
                    if (!canPlacePiece({ ...activePiece, y: activePiece.y + 1 })) fp = 0; 
                }

                if (!isAnimating) {
                    let ghostDrop = 0; while (true) { let test = { ...activePiece, y: activePiece.y + ghostDrop + 1 }; if (canPlacePiece(test)) ghostDrop++; else break; }
                    const gMainId = 'ghost-main', gSubId = 'ghost-sub'; currentIds.add(gMainId); currentIds.add(gSubId);
                    let gMain = document.getElementById(gMainId); if (!gMain) { gMain = document.createElement('div'); gMain.id = gMainId; gMain.className = 'puyo-item ghost'; layer.appendChild(gMain); }
                    let gMainConnStr = `${activeConnMain.t}${activeConnMain.r}${activeConnMain.b}${activeConnMain.l}`; if (gMain.getAttribute('data-conn') !== gMainConnStr) { gMain.innerHTML = createPuyoSVG(activePiece.main.color, true, activeConnMain); gMain.setAttribute('data-conn', gMainConnStr); }
                    let gSub = document.getElementById(gSubId); if (!gSub) { gSub = document.createElement('div'); gSub.id = gSubId; gSub.className = 'puyo-item ghost active-sub-puyo'; layer.appendChild(gSub); }
                    let gSubConnStr = `${activeConnSub.t}${activeConnSub.r}${activeConnSub.b}${activeConnSub.l}`; if (gSub.getAttribute('data-conn') !== gSubConnStr) { gSub.innerHTML = createPuyoSVG(activePiece.sub.color, true, activeConnSub); gSub.setAttribute('data-conn', gSubConnStr); }
                    gMain.style.left = `calc(var(--cell-size) * ${activePiece.x})`; gMain.style.top = `calc(var(--cell-size) * ${activePiece.y + ghostDrop})`; gMain.style.transform = 'none';
                    gSub.style.left = `calc(var(--cell-size) * ${activePiece.x})`; gSub.style.top = `calc(var(--cell-size) * ${activePiece.y + ghostDrop})`; gSub.style.transform = `rotate(${activePiece.angle}deg) translateY(-100%) rotate(${-activePiece.angle}deg)`;
                }

                const aMainDomId = 'puyo-' + activePiece.main.id, aSubDomId = 'puyo-' + activePiece.sub.id; currentIds.add(aMainDomId); currentIds.add(aSubDomId);
                let aMain = document.getElementById(aMainDomId); if (!aMain) { aMain = document.createElement('div'); aMain.id = aMainDomId; layer.appendChild(aMain); }
                let aMainConnStr = `${activeConnMain.t}${activeConnMain.r}${activeConnMain.b}${activeConnMain.l}`; if (aMain.getAttribute('data-conn') !== aMainConnStr) { aMain.innerHTML = createPuyoSVG(activePiece.main.color, false, activeConnMain); aMain.setAttribute('data-conn', aMainConnStr); }
                let aSub = document.getElementById(aSubDomId); if (!aSub) { aSub = document.createElement('div'); aSub.id = aSubDomId; layer.appendChild(aSub); }
                let aSubConnStr = `${activeConnSub.t}${activeConnSub.r}${activeConnSub.b}${activeConnSub.l}`; if (aSub.getAttribute('data-conn') !== aSubConnStr) { aSub.innerHTML = createPuyoSVG(activePiece.sub.color, false, activeConnSub); aSub.setAttribute('data-conn', aSubConnStr); }
                
                const axisClass = activePiece.isLanded ? '' : ' axis-puyo';
                const activeClass = ' active-puyo';
                const landingClass = activePiece.isLanding ? ' puyo-landing' : '';
                const landedClass = activePiece.isLanded && !activePiece.isLanding ? ' puyo-landed' : '';
                aMain.className = 'puyo-item' + axisClass + activeClass + landingClass + landedClass + (isFalling ? ' falling' : ''); 
                aSub.className = 'puyo-item active-sub-puyo' + activeClass + landingClass + landedClass + (isFalling ? ' falling' : '');
                
                aMain.style.left = `calc(var(--cell-size) * ${activePiece.x})`; aMain.style.top = `calc(var(--cell-size) * ${activePiece.y + fp})`; aMain.style.transform = 'none';
                aSub.style.left = `calc(var(--cell-size) * ${activePiece.x})`; aSub.style.top = `calc(var(--cell-size) * ${activePiece.y + fp})`; 
                aSub.style.transform = `rotate(${activePiece.angle}deg) translateY(-100%) rotate(${-activePiece.angle}deg)`;
            }

            Array.from(layer.children).forEach(el => { if (!el.classList.contains('chain-num-popup') && !el.classList.contains('all-clear-popup') && !el.classList.contains('puyo-burst-fragments') && !currentIds.has(el.id)) el.remove(); });
            if (puyoQueue.length >= 2) {
                const updateNext = (id, color, conn) => { let el = document.getElementById(id); let stateStr = `${color}_${conn.t}${conn.r}${conn.b}${conn.l}`; if (el.getAttribute('data-state') !== stateStr) { el.innerHTML = createPuyoSVG(color, false, conn); el.setAttribute('data-state', stateStr); } };
                const updatePair = (pairId, mainId, subId, piece) => {
                    const pair = document.getElementById(pairId);
                    pair.dataset.queueState = `${piece.main}_${piece.sub}`;
                    updateNext(mainId, piece.main, {t:0,r:0,b:0,l:0});
                    updateNext(subId, piece.sub, {t:0,r:0,b:0,l:0});
                };
                updatePair('next1Pair', 'next1Main', 'next1Sub', puyoQueue[0]);
                updatePair('next2Pair', 'next2Main', 'next2Sub', puyoQueue[1]);
            }
            completeQueueAdvance();
        }

        let touchStartX = 0, touchStartY = 0, touchLastX = 0, touchStartTime = 0, isGameGesture = false, hasSwiped = false;
        document.addEventListener('touchstart', (e) => { if (isPaused || e.target.closest('.left-panel, .right-panel, button, .modal-card, .top-bar')) { isGameGesture = false; return; } isGameGesture = true; hasSwiped = false; const t = e.touches[0]; touchStartX = touchLastX = t.clientX; touchStartY = t.clientY; touchStartTime = Date.now(); }, { passive: false });
        document.addEventListener('touchmove', (e) => { 
            if (!isGameGesture) return; e.preventDefault(); const t = e.touches[0];
            const dy = t.clientY - touchStartY;
            const totalDx = t.clientX - touchStartX;
            const isUpSwipe = Math.abs(totalDx) <= Math.abs(dy) * SWIPE_UP_AXIS_RATIO;
            const isDownSwipe = Math.abs(totalDx) <= Math.abs(dy) * SWIPE_DOWN_AXIS_RATIO;
            const downSwipeThreshold = window.innerWidth * SWIPE_DROP_RATIO;
            if (dy > downSwipeThreshold) hasSwiped = true;
            if (isDownSwipe && dy > downSwipeThreshold) {
                dropPiece(); isGameGesture = false; 
                return;
            } else if (isUpSwipe && dy < -window.innerHeight * SWIPE_UP_RATIO) {
                undo(); isGameGesture = false;
                return;
            }
            const dx = t.clientX - touchLastX;
            const swipeThresh = window.innerWidth * SWIPE_LEFTRIGHT_RATIO;
            if (!isDownSwipe && Math.abs(dx) > swipeThresh) {
                if (dx > 0) movePiece(1); else movePiece(-1);
                touchLastX = t.clientX;
                hasSwiped = true;
            }
        }, { passive: false });
        document.addEventListener('touchend', (e) => { if (!isGameGesture || hasSwiped) return; const touchDuration = Date.now() - touchStartTime; if (touchDuration < 350) { const screenX = e.changedTouches[0].clientX; const screenW = window.innerWidth; if (screenX < screenW / 2) rotatePiece(-1); else rotatePiece(1); } }, { passive: false });

        const scoreResetBtn = document.getElementById('scoreResetBtn');
        document.getElementById('resetModal').addEventListener('click', event => {
            if (event.target === event.currentTarget) closeResetModal();
        });
        scoreResetBtn.addEventListener('pointerdown', event => {
            if (event.button === 0) startScoreResetHold();
        });
        scoreResetBtn.addEventListener('pointerup', cancelScoreResetHold);
        scoreResetBtn.addEventListener('pointercancel', cancelScoreResetHold);
        scoreResetBtn.addEventListener('pointerleave', cancelScoreResetHold);
        scoreResetBtn.addEventListener('keydown', event => {
            if (!event.repeat && (event.key === ' ' || event.key === 'Enter')) {
                event.preventDefault();
                startScoreResetHold();
            }
        });
        scoreResetBtn.addEventListener('keyup', event => {
            if (event.key === ' ' || event.key === 'Enter') cancelScoreResetHold();
        });
        window.addEventListener('blur', cancelScoreResetHold);
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) cancelScoreResetHold();
        });
        
        document.addEventListener('keydown', (e) => { 
            if (isPaused) return;
            const key = e.key; const lowerKey = key.toLowerCase();
            if (key === 'ArrowLeft' || lowerKey === 'a') movePiece(-1); 
            if (key === 'ArrowRight' || lowerKey === 'd') movePiece(1); 
            if (key === 'ArrowDown' || lowerKey === 's') dropPiece(); 
            if (lowerKey === 'z' || lowerKey === 'q' || key === '/') rotatePiece(-1); 
            if (lowerKey === 'x' || lowerKey === 'e' || key === 'ArrowUp') rotatePiece(1); 
            if (lowerKey === 'y' || lowerKey === 'r') openResetModal(); 
            if (lowerKey === 'u' && document.activeElement.tagName !== 'INPUT') undo(); 
        });

        window.onload = () => { if (!loadResumeData()) startGame(); else render(); startQueuePuyoJellyAnimations(); openResetModal(); };
        window.addEventListener('blur', saveResumeData); window.addEventListener('beforeunload', saveResumeData);
    </script>
</body>
</html>
