    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        :root {
            --bg-dark-1: #c48d4e;
            --bg-dark-2: #b2793e;
            --cell-size: min(calc((100vw - 136px) / 6), calc((100dvh - 90px) / 13.2), 60px);
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: linear-gradient(135deg, var(--bg-dark-1) 0%, var(--bg-dark-2) 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #2a180d;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
            position: relative;
        }

        .top-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 380px;
            margin-bottom: 8px;
            z-index: 20;
        }

        .score-box {
            flex: 1;
            min-width: 0;
            margin-bottom: 0;
            padding: 5px 8px;
        }

        .stage-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            max-width: 600px;
            flex: 1;
            position: relative;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 8px;
            width: 46px;
            height: calc(var(--cell-size) * 13 + 10px);
            flex-shrink: 0;
            z-index: 30;
            padding-top: 2px;
        }

        .right-panel {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            width: 58px;
            height: calc(var(--cell-size) * 13 + 10px);
            flex-shrink: 0;
            pointer-events: none;
            z-index: 30;
        }

        .right-top {
            display: flex;
            flex-direction: column;
            width: 100%;
            pointer-events: auto;
        }

        .panel-box {
            background: rgba(230, 185, 130, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(107, 62, 29, 0.3);
            border-radius: 6px;
            padding: 4px 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            margin-bottom: 6px;
        }

        .panel-box-next2 { margin-bottom: 14px; }
        .panel-lbl { font-size: 10px; font-weight: 800; color: #4a270f; letter-spacing: -0.2px; margin-bottom: 2px; white-space: nowrap; }
        .stat-val { font-size: clamp(16px, 2.6vh, 22px); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
        .curr-val { color: #ffffff; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6), 0 0 6px rgba(74, 39, 15, 0.8); }
        .ac-val { color: #ffffff; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6), 0 0 6px rgba(74, 39, 15, 0.8); }
        .max-chain-val { color: #ffffff; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6), 0 0 6px rgba(74, 39, 15, 0.8); }

        .side-act-btn {
            width: 100%; border: 2px solid #3d2314; border-radius: 8px; font-weight: 800; color: #fffbeb; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255, 255, 255, 0.2);
            transition: transform 0.08s, background 0.15s; pointer-events: auto; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        }
        .side-act-btn:active { transform: scale(0.92); }
        .side-act-btn:disabled { opacity: 0.35; cursor: not-allowed; }

        .btn-reset { background: linear-gradient(180deg, #993322 0%, #5e1c12 100%); padding: 8px 2px; font-size: 10px; border-color: #3d2314; }
        .btn-undo { background: linear-gradient(180deg, #8c5227 0%, #522d12 100%); padding: 10px 2px; font-size: 11px; font-weight: 900; border-color: #3d2314; }
        .gravity-control { width: 100%; gap: 3px; padding: 4px 2px; margin-bottom: 0; }
        .gravity-step-btn { width: 100%; height: 44px; border: 1px solid #3d2314; border-radius: 5px; background: linear-gradient(180deg, #8c5227 0%, #522d12 100%); color: #fffbeb; font-size: 18px; font-weight: 900; cursor: pointer; }
        .gravity-step-btn:active { transform: scale(0.92); }
        .gravity-step-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .gravity-level { color: #ffffff; font-size: 16px; font-weight: 900; line-height: 1.2; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); white-space: nowrap; }

        .board {
            position: relative; width: calc(var(--cell-size) * 6 + 10px); height: calc(var(--cell-size) * 13 + 10px);
            background: #a36d39; border: 5px solid #3d2314; border-radius: 12px;
            box-shadow: 0 0 15px rgba(61, 35, 20, 0.4), inset 0 0 12px rgba(0, 0, 0, 0.35); flex-shrink: 0; overflow: hidden; isolation: isolate;
        }

        .grid-layer { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(13, 1fr); pointer-events: none; z-index: 0; }
        .grid-cell { border-right: 1px solid rgba(61, 35, 20, 0.18); border-bottom: 1px solid rgba(61, 35, 20, 0.18); }
        .grid-cell:nth-child(6n) { border-right: none; }
        .grid-cell:nth-last-child(-n+6) { border-bottom: none; }

        .death-line {
            position: absolute; top: calc(var(--cell-size) * 1); left: 0; right: 0; height: 2px;
            display: grid; grid-template-columns: repeat(6, 1fr); pointer-events: none; z-index: -1;
        }
        .death-line-segment { border-top: 2px dashed #ef4444; box-shadow: 0 0 8px rgba(239, 68, 68, 0.9); }

        #puyoLayer { position: absolute; inset: 0; pointer-events: none; z-index: 2; }

        .puyo-item {
            position: absolute; width: var(--cell-size); height: var(--cell-size); padding: 0;
            will-change: left, top, transform; 
            transition: left 0.08s ease-out, top 0.08s linear, transform 0.12s cubic-bezier(0.2, 0.8, 0.2, 1); 
            z-index: 10;
        }
        
        .puyo-item.active-puyo { transition: left 0.08s ease-out, transform 0.12s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .puyo-item.falling { transition: top var(--fall-duration, 0.12s) cubic-bezier(0.25, 0.1, 0.25, 1), left 0.08s ease-out, transform 0.12s cubic-bezier(0.2, 0.8, 0.2, 1) !important; }
        .puyo-item.ghost { opacity: 0.35; filter: saturate(0.6); z-index: 5; }
        .puyo-item.active-sub-puyo { z-index: 12; transition: left 0.08s ease-out, transform 0.12s cubic-bezier(0.2, 0.8, 0.2, 1); }

        .puyo-inner {
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; transform-origin: center center;
        }
        .puyo-item.puyo-pop { z-index: 20; }
        .puyo-pop > .puyo-inner {
            animation: puyoPopBody 0.5s ease-in forwards, puyoPopVanish 1ms linear calc(445ms + var(--burst-delay, 0ms)) forwards;
        }
        #puyoBurstLayer { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 15; }
        .puyo-burst-fragments { position: absolute; pointer-events: none; }
        .puyo-burst-fragment { position: absolute; top: 42%; left: 50%; width: 48%; height: 48%; opacity: 0; will-change: transform, opacity; }
        @keyframes puyoPopBody {
            0% { transform: scale(1); }
            14%, 100% { transform: scale(1.2); }
        }
        @keyframes puyoPopVanish { to { opacity: 0; } }

<body class="game-paused">

    <script>
        const COLS = 6;
        const ROWS = 13; 
        const SAVE_STORAGE_KEY = 'PUYO_CHAIN_PRACTICE_RESUME_DATA';
        const LOCK_DELAY_MS = 530;
        const SCORE_RESET_HOLD_MS = 5000;
        const DROP_STEP_DURATION_MS = 16;
        // const GRAVITY_INTERVALS = [0, 1500, 1000, 530, 400, 270];
        const GRAVITY_INTERVALS = [0, 1200, 530, 270, 110, 60];

        const MASTER_PUYO_THEMES = {
            1: { base: '#ff1744', stroke: '#880015' }, 2: { base: '#0088ff', stroke: '#003299' }, 
            3: { base: '#00c853', stroke: '#004d1a' }, 4: { base: '#ffd600', stroke: '#7c5900' }, 5: { base: '#d500f9', stroke: '#500075' }  
        };

        const ROTATIONS = [{ dx: 0, dy: -1 }, { dx: 1, dy: 0 }, { dx: 0, dy: 1 }, { dx: -1, dy: 0 }];
        const CHAIN_BONUS_TABLE = [0, 0, 8, 16, 32, 64, 96, 128, 160, 192, 224, 256, 288, 320, 352, 384, 416, 448, 480, 512];
        
        const SWIPE_UP_RATIO = 0.15;
        const SWIPE_DROP_RATIO = 0.06;
        const SWIPE_LEFTRIGHT_RATIO = 0.06;

        const SWIPE_UP_AXIS_RATIO = 0.45;
        const SWIPE_DOWN_AXIS_RATIO = 1.0;
        const ALL_CLEAR_SCORE_BONUS = 2100;

        function getChainBonus(chain) { if (chain <= 1) return 0; if (chain < CHAIN_BONUS_TABLE.length) return CHAIN_BONUS_TABLE[chain]; return 512; }
        function getConnectBonus(count) { if (count <= 4) return 0; if (count <= 10) return count - 3; return 10; }
        function getColorBonus(colorCount) { if (colorCount <= 1) return 0; if (colorCount === 2) return 3; if (colorCount === 3) return 6; if (colorCount === 4) return 10; return 15; }
        function triggerVibration(pattern) { if (typeof navigator !== 'undefined' && navigator.vibrate) { try { navigator.vibrate(pattern); } catch (e) {} } }
        let isPaused = true, gameSessionId = 0;
        const activeDelays = new Set();
        let pausedBoardAnimations = [];
        let pausedBurstAnimations = [];
        let pausedLockDelayRemaining = null;
        let scoreResetHoldStartedAt = null;
        let scoreResetHoldFrame = null;
        let modalTitlePuyoTimer = null;
        let modalTitlePuyoRightTimer = null;

        function sleep(ms) {
            return new Promise(resolve => {
                const delay = {
                    remaining: ms,
                    startedAt: 0,
                    timerId: null,
                    start() {
                        if (isPaused || this.timerId !== null) return;
                        this.startedAt = performance.now();
                        this.timerId = setTimeout(() => {
                            this.timerId = null;
                            activeDelays.delete(this);
                            resolve();
                        }, this.remaining);
                    },
                    pause() {
                        if (this.timerId === null) return;
                        clearTimeout(this.timerId);
                        this.timerId = null;
                        this.remaining = Math.max(0, this.remaining - (performance.now() - this.startedAt));
                    }
                };
                if (ms <= 0) {
                    resolve();
                    return;
                }
                activeDelays.add(delay);
                delay.start();
            });
        }

        let activeColorPalette = [], board = [], puyoQueue = [], activePiece = null, historyStack = [];
        let maxChainCount = 0, currentAllClearCount = 0, maxAllClearCount = 0, totalPoppedCount = 0, currentScore = 0, maxScore = 0;
        let currentColorCount = 4, isAnimating = false, isDropping = false, isGameOver = false, nextPuyoId = 1, unconnectedIds = new Set();
        
        let gravityLevel = 0, gravityEnabled = false, gravityInterval = 1500;
        let gravityRAF = null, lastTime = null;

        function updateGravityControl() {
            document.getElementById('gravityLevelDisp').textContent = gravityLevel === 0 ? 'OFF' : `${gravityLevel}速`;
            document.getElementById('gravityUpBtn').disabled = gravityLevel === 0;
            document.getElementById('gravityDownBtn').disabled = gravityLevel === GRAVITY_INTERVALS.length - 1;
        }

        function changeGravityLevel(step) {
            if (isPaused) return;
            gravityLevel = Math.max(0, Math.min(GRAVITY_INTERVALS.length - 1, gravityLevel + step));
            gravityEnabled = gravityLevel > 0;
            if (gravityEnabled) gravityInterval = GRAVITY_INTERVALS[gravityLevel];
            stopGravity();
            if ((gravityEnabled || activePiece?.isLanded) && activePiece && !isGameOver && !isAnimating) startGravity();
            updateGravityControl();
            render();
            saveResumeData();
        }

        function gravityLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const delta = timestamp - lastTime;
            lastTime = timestamp;

            if (gravityEnabled && !isGameOver && !isAnimating && activePiece) {
                activePiece.fallProgress = (activePiece.fallProgress || 0) + (delta / gravityInterval);
                
                if (activePiece.fallProgress >= 1) {
                    let steps = Math.floor(activePiece.fallProgress);
                    activePiece.fallProgress -= steps;
                    for (let i = 0; i < steps; i++) {
                        if (canPlacePiece({ ...activePiece, y: activePiece.y + 1 })) {
                            activePiece.y++;
                        } else {
                            activePiece.fallProgress = 0;
                            break;
                        }
                    }
                }
            }

            if (activePiece && !isGameOver && !isAnimating) {
                const now = Date.now();
                updateLandingState(now);
                lockPieceIfReady(now);
            }

            if (!isAnimating) render();
            if ((gravityEnabled || activePiece?.isLanded) && !isGameOver && !isAnimating && activePiece) {
                gravityRAF = requestAnimationFrame(gravityLoop);
            } else {
                gravityRAF = null;
            }
        }

        function startGravity() {
            stopGravity();
            if (!isPaused && (gravityEnabled || activePiece?.isLanded) && !isGameOver && !isAnimating && activePiece) {
                lastTime = null;
                gravityRAF = requestAnimationFrame(gravityLoop);
            }
        }

        function stopGravity() {
            if (gravityRAF) { cancelAnimationFrame(gravityRAF); gravityRAF = null; }
        }

        function saveResumeData() {
            try {
                const data = { board, puyoQueue, activeColorPalette, currentColorCount, currentScore, maxScore, totalPoppedCount, maxAllClearCount, currentAllClearCount, maxChainCount, nextPuyoId, isGameOver, activePiece: activePiece ? { ...activePiece } : null, gravityLevel, gravityEnabled, gravityInterval };
                localStorage.setItem(SAVE_STORAGE_KEY, JSON.stringify(data));
            } catch (e) {}
        }

        function loadResumeData() {
            try {
                const json = localStorage.getItem(SAVE_STORAGE_KEY); if (!json) return false;
                const data = JSON.parse(json); if (!data || !data.board) return false;
                board = data.board; puyoQueue = data.puyoQueue || []; currentColorCount = data.currentColorCount || 4;
                if (Array.isArray(data.activeColorPalette) && data.activeColorPalette.length === currentColorCount) { activeColorPalette = [...data.activeColorPalette]; } else { pickColorPalette(); }
                currentScore = data.currentScore || 0; maxScore = data.maxScore || 0; totalPoppedCount = data.totalPoppedCount || 0; maxAllClearCount = data.maxAllClearCount || 0; currentAllClearCount = data.currentAllClearCount || 0; maxChainCount = data.maxChainCount || 0; nextPuyoId = data.nextPuyoId || 1; isGameOver = !!data.isGameOver; 
                activePiece = data.activePiece ? { ...data.activePiece, rot: data.activePiece.rot || 0, angle: data.activePiece.angle || 0, fallProgress: data.activePiece.fallProgress || 0 } : null;
                if (activePiece) {
                    activePiece.landedAt = activePiece.isLanded ? Date.now() : null;
                    activePiece.isLanding = false;
                }
                if (Number.isInteger(data.gravityLevel) && data.gravityLevel >= 0 && data.gravityLevel < GRAVITY_INTERVALS.length) {
                    gravityLevel = data.gravityLevel;
                } else if (data.gravityEnabled) {
                    const legacyLevel = [1500, 1000, 530, 400, 270].indexOf(Number(data.gravityInterval));
                    gravityLevel = legacyLevel === -1 ? 1 : legacyLevel + 1;
                } else {
                    gravityLevel = 0;
                }
                gravityEnabled = gravityLevel > 0;
                gravityInterval = gravityEnabled ? GRAVITY_INTERVALS[gravityLevel] : 1500;
                updateGravityControl();
                historyStack = []; unconnectedIds.clear(); isAnimating = false; isDropping = false; initGrid(); document.getElementById('puyoLayer').innerHTML = ''; clearPuyoBurstEffects(); updateStatsUI(); updateUndoBtn();
                updatePupilDirections();
                if (isGameOver) { document.getElementById('gameOverMask').classList.remove('hidden'); } else { document.getElementById('gameOverMask').classList.add('hidden'); if (!activePiece) spawnPiece(); }
                render(); return true;
            } catch (e) { return false; }
        }

        function createPuyoConnectionMarkup(colorIndex, conn) {
            const theme = MASTER_PUYO_THEMES[colorIndex];
            if (!theme) return '';
            const seamOverlap = 1.2;
            let connFill = "", connOutline = "";
            if (conn.r) connFill += `<rect x="20" y="14" width="${25 + seamOverlap}" height="24" fill="${theme.base}" />`;
            if (conn.l) connFill += `<rect x="${-seamOverlap}" y="14" width="${25 + seamOverlap}" height="24" fill="${theme.base}" />`;
            if (conn.b) connFill += `<rect x="7.5" y="20" width="30" height="${25 + seamOverlap}" fill="${theme.base}" />`;
            if (conn.t) connFill += `<rect x="7.5" y="${-seamOverlap}" width="30" height="${25 + seamOverlap}" fill="${theme.base}" />`;
            if (conn.r) connOutline += `<path d="M 37.5 13.123 H ${45 + seamOverlap} M 37.5 37.87 H ${45 + seamOverlap}" fill="none" stroke="${theme.stroke}" stroke-width="2.5" stroke-linecap="butt" />`;
            if (conn.l) connOutline += `<path d="M ${-seamOverlap} 13.123 H 7.5 M ${-seamOverlap} 37.87 H 7.5" fill="none" stroke="${theme.stroke}" stroke-width="2.5" stroke-linecap="butt" />`;
            if (conn.b) connOutline += `<path d="M 7.5 37.87 V ${45 + seamOverlap} M 37.5 37.87 V ${45 + seamOverlap}" fill="none" stroke="${theme.stroke}" stroke-width="2.5" stroke-linecap="butt" />`;
            if (conn.t) connOutline += `<path d="M 7.5 ${-seamOverlap} V 13.123 M 37.5 ${-seamOverlap} V 13.123" fill="none" stroke="${theme.stroke}" stroke-width="2.5" stroke-linecap="butt" />`;
            return `${connFill}${connOutline}`;
        }

        function createPuyoSVG(colorIndex, isGhost = false, conn = {t:0, r:0, b:0, l:0}, pupilOffsets = null, isBurst = false) {
            if (!colorIndex || !MASTER_PUYO_THEMES[colorIndex]) return '';
            const theme = MASTER_PUYO_THEMES[colorIndex];
            const pupils = pupilOffsets || [{ x: 0, y: 0 }, { x: 0, y: 0 }];

        function getSubPos(piece) { let rotIdx = (piece.rot || 0) % 4; return { x: piece.x + ROTATIONS[rotIdx].dx, y: piece.y + ROTATIONS[rotIdx].dy }; }
        function isValidPos(x, y) { if (x < 0 || x >= COLS || y >= ROWS) return false; if (y >= 0 && board[y][x] !== null) return false; return true; }
        function canPlacePiece(piece) { return isValidPos(piece.x, piece.y) && isValidPos(getSubPos(piece).x, getSubPos(piece).y); }

        function getConnectedPuyos(start) {
            const color = board[start.y][start.x]?.color;
            if (!color) return [];
            const group = [], queue = [start], visited = new Set([`${start.x},${start.y}`]);
            while (queue.length > 0) {
                const current = queue.shift();
                group.push(current);
                for (const [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
                    const x = current.x + dx, y = current.y + dy, key = `${x},${y}`;
                    if (x >= 0 && x < COLS && y >= 0 && y < ROWS && !visited.has(key) && board[y][x]?.color === color) {
                        visited.add(key);
                        queue.push({ x, y });
                    }
                }
            }
            return group;
        }

        function getRandomPupilOffset() {
            const angle = Math.random() * Math.PI * 2, distance = 2.2 + Math.random() * 0.7;
            return { x: Math.cos(angle) * distance, y: Math.sin(angle) * distance };
        }

        function updatePupilDirections(puyoIds = null) {
            const starts = [];
            if (puyoIds) {
                const ids = new Set(puyoIds);
                for (let y = 0; y < ROWS; y++) {
                    for (let x = 0; x < COLS; x++) {
                        if (board[y][x] && ids.has(board[y][x].id)) starts.push({ x, y });
                    }
                }
            } else {
                for (let y = 0; y < ROWS; y++) {
                    for (let x = 0; x < COLS; x++) {
                        if (board[y][x]) starts.push({ x, y });
                    }
                }
            }

            const processed = new Set();
            for (const start of starts) {
                const group = getConnectedPuyos(start);
                if (group.some(({ x, y }) => processed.has(board[y][x].id))) continue;
                group.forEach(({ x, y }) => processed.add(board[y][x].id));
                group.forEach(({ x, y }, index) => {
                    const cell = board[y][x];
                    if (group.length === 2) {
                        const partner = group[1 - index];
                        const distance = Math.hypot(partner.x - x, partner.y - y);
                        const offset = { x: ((partner.x - x) / distance) * 2.6, y: ((partner.y - y) / distance) * 2.6 };
                        cell.pupilOffsets = [offset, { ...offset }];
                    } else if (group.length >= 3) {
                        const neighbors = group.filter(({ x: neighborX, y: neighborY }) =>
                            Math.abs(neighborX - x) + Math.abs(neighborY - y) === 1
                        );
                        if (neighbors.length === 1) {
                            const neighbor = neighbors[0];
                            const offset = { x: (neighbor.x - x) * 2.6, y: (neighbor.y - y) * 2.6 };
                            cell.pupilOffsets = [offset, { ...offset }];
                        } else if (neighbors.length >= 2) {
                            cell.pupilOffsets = [getRandomPupilOffset(), getRandomPupilOffset()];
                        } else {
                            cell.pupilOffsets = [{ x: 0, y: 0 }, { x: 0, y: 0 }];
                        }

                        cell.pupilOffsets = [{ x: 0, y: 0 }, { x: 0, y: 0 }];
                    }

            }
        }

            if (canPlacePiece(test)) { activePiece = test; updateLandingState(); ensureGravityRunning(); lastRotateFailedState = null; render(); triggerVibration(10); }
        }

        function rotatePiece(dir) {
            if (isPaused || isAnimating || isDropping || isGameOver || !activePiece) return;
            if (lockPieceIfReady()) return;
            
            let currentRot = activePiece.rot || 0;
            let currentAngle = activePiece.angle || 0;
            let newRot = (currentRot + dir + 4) % 4;
            let newAngle = currentAngle + (dir * 90);
            let test = { ...activePiece, rot: newRot, angle: newAngle };
            
            let success = false;
            let finalPiece = null;

            if (canPlacePiece(test)) { 
                finalPiece = test; success = true; 
            } else {
                if (newRot === 1 || newRot === 3) {
                    let kickX = newRot === 1 ? -1 : 1;
                    let kick = { ...test, x: test.x + kickX };
                    if (canPlacePiece(kick)) { finalPiece = kick; success = true; }
                } else {
                    let kickU = { ...test, y: test.y - 1 };
                    if (canPlacePiece(kickU)) { finalPiece = kickU; success = true; }
                }
            }

            if (!success) {
                if (lastRotateFailedState && lastRotateFailedState.dir === dir && lastRotateFailedState.x === activePiece.x && lastRotateFailedState.y === activePiece.y) {
                    let quickRot = (currentRot + 2) % 4;
                    let quickAngle = currentAngle + 180;
                    let quickTest = { ...activePiece, rot: quickRot, angle: quickAngle };
                    if (canPlacePiece(quickTest)) {

                        let quickKickU = { ...quickTest, y: quickTest.y - 1 };
                        if (canPlacePiece(quickKickU)) { finalPiece = quickKickU; success = true; }
                    }
                }
            }

            if (success) {
                activePiece = finalPiece; updateLandingState(); ensureGravityRunning(); lastRotateFailedState = null; render(); triggerVibration(10);
            } else {
                lastRotateFailedState = { dir: dir, x: activePiece.x, y: activePiece.y };
            }

        function saveState() {

        async function dropPiece() {
            if (isPaused || isAnimating || isDropping || isGameOver || !activePiece) return;
            const sessionId = gameSessionId;
            let dist = 0;
            while (true) { let test = { ...activePiece, y: activePiece.y + dist + 1 }; if (canPlacePiece(test)) dist++; else break; }

        async function lockPiece(animateLanding = false, isAlreadyAnimating = false, stateIsSaved = false) {

        async function applyGravity() {
            const sessionId = gameSessionId;
            let movedIds = [], oldGroupIdsById = new Map(), visitedIds = new Set();
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const cell = board[y][x];
                    if (!cell || visitedIds.has(cell.id)) continue;
                    const groupIds = getConnectedPuyos({ x, y }).map(({ x: groupX, y: groupY }) => board[groupY][groupX].id);
                    groupIds.forEach(id => {
                        visitedIds.add(id);
                        oldGroupIdsById.set(id, groupIds);
                    });
                }
            }
            for (let x = 0; x < COLS; x++) { let writeY = ROWS - 1; for (let y = ROWS - 1; y >= 0; y--) { if (board[y][x]) { if (writeY !== y) { board[writeY][x] = board[y][x]; board[y][x] = null; movedIds.push(board[writeY][x].id); } writeY--; } } }
            if (movedIds.length > 0) { 
                const affectedIds = new Set(movedIds);
                movedIds.forEach(id => oldGroupIdsById.get(id)?.forEach(groupId => affectedIds.add(groupId)));
                movedIds.forEach(id => unconnectedIds.add(id)); render(true); await sleep(120);
                if (sessionId !== gameSessionId) return [];
                movedIds.forEach(id => { for (let y = 0; y < ROWS; y++) { for (let x = 0; x < COLS; x++) { if (board[y][x] && board[y][x].id === id) { board[y][x].isLanding = true; } } } });
                render(); await sleep(300);
                if (sessionId !== gameSessionId) return [];
                movedIds.forEach(id => { for (let y = 0; y < ROWS; y++) { for (let x = 0; x < COLS; x++) { if (board[y][x] && board[y][x].id === id) { board[y][x].isLanding = false; } } } });
                movedIds.forEach(id => unconnectedIds.delete(id)); updatePupilDirections([...affectedIds]); render();

        }

        function findMatches() {
            let visited = Array.from({ length: ROWS }, () => Array(COLS).fill(false)), toErase = [], eraseGroups = [];
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    let cell = board[y][x];
                    if (cell && !visited[y][x]) {
                        let group = [], queue = [{ x, y }]; visited[y][x] = true;
                        while (queue.length > 0) {
                            let curr = queue.shift(); group.push(curr);
                            [[0,1], [0,-1], [1,0], [-1,0]].forEach(([dx, dy]) => { let nx = curr.x + dx, ny = curr.y + dy; if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) { if (!visited[ny][nx] && board[ny][nx] && board[ny][nx].color === cell.color) { visited[ny][nx] = true; queue.push({ x: nx, y: ny }); } } });
                        }
                        if (group.length >= 4) { toErase = toErase.concat(group); eraseGroups.push({ color: cell.color, count: group.length, positions: group }); }
                    }
                }
            } return { toErase, eraseGroups };
        }

        function isBoardEmpty() { for (let y = 0; y < ROWS; y++) { for (let x = 0; x < COLS; x++) { if (board[y][x] !== null) return false; } } return true; }

        async function resolveChains() {
            const sessionId = gameSessionId;
            isAnimating = true; let currentChain = 0; let firstChainStarted = false;
            let movedIds = await applyGravity();
            if (sessionId !== gameSessionId) return;

            while (true) {
                let { toErase, eraseGroups } = findMatches(); if (toErase.length === 0) break;
                if (!firstChainStarted) { currentScore = 0; totalPoppedCount = 0; firstChainStarted = true; }
                currentChain++; if (currentChain > maxChainCount) maxChainCount = currentChain;
                totalPoppedCount += toErase.length; triggerVibration([30, 20]);

                let totalErasedCount = 0, connectBonusSum = 0, colorsErased = new Set();
                for (let g of eraseGroups) { totalErasedCount += g.count; connectBonusSum += getConnectBonus(g.count); colorsErased.add(g.color); }
                let colorBonus = getColorBonus(colorsErased.size), chainBonus = getChainBonus(currentChain); let totalBonus = chainBonus + connectBonusSum + colorBonus;
                if (totalBonus === 0) totalBonus = 1; if (totalBonus > 999) totalBonus = 999;
                
                currentScore += totalErasedCount * totalBonus * 10; if (currentScore > maxScore) maxScore = currentScore;
                const scoreBase = totalErasedCount * 10;
                updateStatsUI(`${scoreBase} x ${totalBonus}`);

                let sumX = 0, sumY = 0;
                let maxBurstDelay = 0;
                for (const group of eraseGroups) {
                    const burstOrder = [...group.positions];
                    for (let i = burstOrder.length - 1; i > 0; i--) {
                        const randomIndex = Math.floor(Math.random() * (i + 1));
                        [burstOrder[i], burstOrder[randomIndex]] = [burstOrder[randomIndex], burstOrder[i]];
                    }
                    burstOrder.forEach(({ x, y }, index) => {
                        const burstDelay = Math.min(index, 3) * 100;
                        board[y][x].burstDelay = burstDelay;
                        board[y][x].burstFinished = false;
                        maxBurstDelay = Math.max(maxBurstDelay, burstDelay);
                    });
                }
                for (let pos of toErase) { sumX += pos.x; sumY += pos.y; board[pos.y][pos.x].isPopping = true; }
                centerPupils(toErase.map(({ x, y }) => board[y][x].id));
                render(); showChainPopup(sumX / toErase.length, sumY / toErase.length, currentChain); await sleep(Math.max(700, 445 + maxBurstDelay + 10));
                if (sessionId !== gameSessionId) return;

                for (let pos of toErase) {
                    if (board[pos.y][pos.x]) {
                        let id = board[pos.y][pos.x].id;
                        let el = document.getElementById('puyo-' + id);
                        if (el) {
                            el.remove();
                        }
                        board[pos.y][pos.x] = null;
                    }
                }
                updateStatsUI();
                render(); movedIds = await applyGravity();
                if (sessionId !== gameSessionId) return;
            }

            updateStatsUI();
            if (currentChain > 0 && isBoardEmpty()) {
                currentAllClearCount++;
                if (currentAllClearCount > maxAllClearCount) maxAllClearCount = currentAllClearCount;
                currentScore += ALL_CLEAR_SCORE_BONUS;
                if (currentScore > maxScore) maxScore = currentScore;
                updateStatsUI();
                saveResumeData();
                showAllClearPopup();
                triggerVibration([50, 30, 50]);
                await sleep(800);
                if (sessionId !== gameSessionId) return;
            }
            isAnimating = false; if (!isGameOver) { spawnPiece(); render(); }
        }

        function showChainPopup(gridX, gridY, chainNumber) {
            const layer = document.getElementById('puyoLayer'), popup = document.createElement('div'); popup.className = 'chain-num-popup'; popup.innerText = `${chainNumber}`;
            popup.style.left = `clamp(20px, calc(var(--cell-size) * ${gridX + 0.5}), calc(var(--cell-size) * 6 - 20px))`; popup.style.top = `clamp(20px, calc(var(--cell-size) * ${gridY + 0.5}), calc(var(--cell-size) * 13 - 20px))`;
            layer.appendChild(popup); sleep(1400).then(() => { if (popup.parentNode) popup.remove(); });
        }

        function showAllClearPopup() {
            const layer = document.getElementById('puyoLayer'), popup = document.createElement('div'); popup.className = 'all-clear-popup'; popup.innerText = '全消し';
            layer.appendChild(popup); sleep(1000).then(() => { if (popup.parentNode) popup.remove(); });
        }

        function animatePuyoBurst(fragment, direction, delayOffset = 0) {
            const randomBetween = (min, max) => min + Math.random() * (max - min);
            const endX = direction * randomBetween(150, 520), endY = randomBetween(-180, 220);
            const sideSway = randomBetween(-150, 150), arcHeight = randomBetween(260, 480);
            const rotation = direction * randomBetween(70, 150);
            const startScale = randomBetween(0.5, 0.8), endScale = randomBetween(0.08, 0.2);
            const shrinkExponent = randomBetween(1.1, 2.4), fragmentBaseScale = 0.48;
            const keyframes = Array.from({ length: 61 }, (_, index) => {
                const progress = index / 60;
                const x = endX * progress + 4 * sideSway * progress * (1 - progress);
                const y = endY * progress - 4 * arcHeight * progress * (1 - progress);
                const scale = (startScale - (startScale - endScale) * Math.pow(progress, shrinkExponent)) / fragmentBaseScale;
                const opacity = progress < 0.88 ? 1 : 1 - (progress - 0.88) / 0.12;
                return {
                    transform: `translate(calc(-50% + ${x}%), calc(-50% + ${y}%)) scale(${scale}) rotate(${rotation * progress}deg)`,
                    opacity
                };
            });

            const easeIn = randomBetween(0.04, 0.3), easeOut = randomBetween(0.55, 0.95);
            fragment.animate(keyframes, {
                delay: 445 + delayOffset,
                duration: randomBetween(800, 1450),
                easing: `cubic-bezier(${easeIn}, ${randomBetween(0.55, 0.95)}, ${easeOut}, 1)`,
                fill: 'forwards'
            });
        }

        async function finishPuyoBurstAfterDelay(puyoId, delay, sessionId) {
            await sleep(delay + 1);
            if (sessionId !== gameSessionId) return;
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const cell = board[y][x];
                    if (cell?.id === puyoId && cell.isPopping) {
                        cell.burstFinished = true;
                        render();
                        return;
                    }
                }
            }
        }

        function updateStatsUI(scoreDisplay = currentScore) { document.getElementById('currScoreDisp').innerText = String(scoreDisplay); document.getElementById('maxScoreDisp').innerText = maxScore; document.getElementById('totalPoppedDisp').innerText = totalPoppedCount; document.getElementById('maxAllClearDisp').innerText = maxAllClearCount; document.getElementById('maxChainDisp').innerText = maxChainCount; }

        function render(isFalling = false) {
            const layer = document.getElementById('puyoLayer'); const currentIds = new Set();
            const gridCells = document.getElementById('gridBg').children;
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const cell = board[y][x];
                    gridCells[y * COLS + x].className = 'grid-cell';
                    if (board[y][x]) {
                        const item = board[y][x], domId = 'puyo-' + item.id; currentIds.add(domId);
                        let conn = { t:0, r:0, b:0, l:0 };
                        if (!unconnectedIds.has(item.id)) {
                            if (y > 0 && board[y-1][x] && board[y-1][x].color === item.color && !(board[y-1][x].isPopping && board[y-1][x].burstFinished) && !unconnectedIds.has(board[y-1][x].id)) conn.t = 1;
                            if (y < ROWS-1 && board[y+1][x] && board[y+1][x].color === item.color && !(board[y+1][x].isPopping && board[y+1][x].burstFinished) && !unconnectedIds.has(board[y+1][x].id)) conn.b = 1;
                            if (x > 0 && board[y][x-1] && board[y][x-1].color === item.color && !(board[y][x-1].isPopping && board[y][x-1].burstFinished) && !unconnectedIds.has(board[y][x-1].id)) conn.l = 1;
                            if (x < COLS-1 && board[y][x+1] && board[y][x+1].color === item.color && !(board[y][x+1].isPopping && board[y][x+1].burstFinished) && !unconnectedIds.has(board[y][x+1].id)) conn.r = 1;
                        }
                        let connStr = `${conn.t}${conn.r}${conn.b}${conn.l}`;
                        let el = document.getElementById(domId); if (!el) { el = document.createElement('div'); el.id = domId; el.className = 'puyo-item'; layer.appendChild(el); }
                        const pupilState = JSON.stringify(item.pupilOffsets || [{ x: 0, y: 0 }, { x: 0, y: 0 }]);
                        if (!el.hasAttribute('data-conn')) {
                            el.innerHTML = createPuyoSVG(item.color, false, conn, item.pupilOffsets);
                            el.setAttribute('data-conn', connStr);
                            el.setAttribute('data-pupils', pupilState);
                        } else if (item.isPopping) {
                            if (el.getAttribute('data-conn') !== connStr) {
                                const connection = el.querySelector('.puyo-connection');
                                if (connection) connection.innerHTML = createPuyoConnectionMarkup(item.color, conn);
                                el.setAttribute('data-conn', connStr);
                            }
                            if (el.getAttribute('data-pupils') !== pupilState) {
                                const pupils = item.pupilOffsets || [{ x: 0, y: 0 }, { x: 0, y: 0 }];
                                el.querySelectorAll('circle[fill="#0f172a"]').forEach((pupil, index) => {
                                    pupil.setAttribute('transform', `translate(${pupils[index]?.x || 0} ${pupils[index]?.y || 0})`);
                                });
                                el.setAttribute('data-pupils', pupilState);
                            }
                        } else if (el.getAttribute('data-conn') !== connStr || el.getAttribute('data-pupils') !== pupilState) {
                            el.innerHTML = createPuyoSVG(item.color, false, conn, item.pupilOffsets);
                            el.setAttribute('data-conn', connStr);
                            el.setAttribute('data-pupils', pupilState);
                        }
                        el.className = 'puyo-item' + (isFalling ? ' falling' : ''); el.style.left = `calc(var(--cell-size) * ${x})`; el.style.top = `calc(var(--cell-size) * ${y})`; el.style.transform = 'none';
                        if (item.isPopping) el.style.setProperty('--burst-delay', `${item.burstDelay || 0}ms`);
                        else el.style.removeProperty('--burst-delay');
                        if (item.isPopping) {
                            el.classList.add('puyo-pop');
                            const burstId = `puyo-burst-${item.id}`;
                            if (!document.getElementById(burstId)) {
                                const bounds = el.getBoundingClientRect();
                                const fragments = document.createElement('div');
                                fragments.className = 'puyo-burst-fragments';
                                fragments.id = burstId;
                                fragments.setAttribute('aria-hidden', 'true');
                                fragments.style.left = `${bounds.left}px`;
                                fragments.style.top = `${bounds.top}px`;
                                fragments.style.width = `${bounds.width}px`;
                                fragments.style.height = `${bounds.height}px`;
                                //[-1, -0.35, 0.35, 1].forEach(direction => {
                                [-1, 1].forEach(direction => {
                                    const fragment = document.createElement('div');
                                    fragment.className = 'puyo-burst-fragment';
                                    fragment.innerHTML = createPuyoSVG(item.color, true, undefined, undefined, true);
                                    fragments.appendChild(fragment);
                                    animatePuyoBurst(fragment, direction, item.burstDelay);
                                });
                                const burstLayer = document.getElementById('puyoBurstLayer');
                                burstLayer.appendChild(fragments);
                                finishPuyoBurstAfterDelay(item.id, 445 + (item.burstDelay || 0), gameSessionId);
                                Promise.allSettled(Array.from(fragments.querySelectorAll('.puyo-burst-fragment'))
                                    .flatMap(fragment => fragment.getAnimations().map(animation => animation.finished)))
                                    .then(() => fragments.remove());
                            }
                        } else {
                            document.getElementById(`puyo-burst-${item.id}`)?.remove();
                        }
                        if (item.isLanding) el.classList.add('puyo-landing'); else el.classList.remove('puyo-landing');
                    }
                }
            }

            if (activePiece) {
                let activeConnMain = { t:0, r:0, b:0, l:0 }, activeConnSub = { t:0, r:0, b:0, l:0 };
                
                let fp = 0;
                if (!isAnimating && gravityEnabled) {
                    fp = activePiece.fallProgress || 0;
                    if (!canPlacePiece({ ...activePiece, y: activePiece.y + 1 })) fp = 0; 
                }

                if (!isAnimating) {
                    let ghostDrop = 0; while (true) { let test = { ...activePiece, y: activePiece.y + ghostDrop + 1 }; if (canPlacePiece(test)) ghostDrop++; else break; }
                    const gMainId = 'ghost-main', gSubId = 'ghost-sub'; currentIds.add(gMainId); currentIds.add(gSubId);
                    let gMain = document.getElementById(gMainId); if (!gMain) { gMain = document.createElement('div'); gMain.id = gMainId; gMain.className = 'puyo-item ghost'; layer.appendChild(gMain); }
                    let gMainConnStr = `${activeConnMain.t}${activeConnMain.r}${activeConnMain.b}${activeConnMain.l}`; if (gMain.getAttribute('data-conn') !== gMainConnStr) { gMain.innerHTML = createPuyoSVG(activePiece.main.color, true, activeConnMain); gMain.setAttribute('data-conn', gMainConnStr); }
                    let gSub = document.getElementById(gSubId); if (!gSub) { gSub = document.createElement('div'); gSub.id = gSubId; gSub.className = 'puyo-item ghost active-sub-puyo'; layer.appendChild(gSub); }
                    let gSubConnStr = `${activeConnSub.t}${activeConnSub.r}${activeConnSub.b}${activeConnSub.l}`; if (gSub.getAttribute('data-conn') !== gSubConnStr) { gSub.innerHTML = createPuyoSVG(activePiece.sub.color, true, activeConnSub); gSub.setAttribute('data-conn', gSubConnStr); }
                    gMain.style.left = `calc(var(--cell-size) * ${activePiece.x})`; gMain.style.top = `calc(var(--cell-size) * ${activePiece.y + ghostDrop})`; gMain.style.transform = 'none';
                    gSub.style.left = `calc(var(--cell-size) * ${activePiece.x})`; gSub.style.top = `calc(var(--cell-size) * ${activePiece.y + ghostDrop})`; gSub.style.transform = `rotate(${activePiece.angle}deg) translateY(-100%) rotate(${-activePiece.angle}deg)`;
                }

                const aMainDomId = 'puyo-' + activePiece.main.id, aSubDomId = 'puyo-' + activePiece.sub.id; currentIds.add(aMainDomId); currentIds.add(aSubDomId);
                let aMain = document.getElementById(aMainDomId); if (!aMain) { aMain = document.createElement('div'); aMain.id = aMainDomId; layer.appendChild(aMain); }
                let aMainConnStr = `${activeConnMain.t}${activeConnMain.r}${activeConnMain.b}${activeConnMain.l}`; if (aMain.getAttribute('data-conn') !== aMainConnStr) { aMain.innerHTML = createPuyoSVG(activePiece.main.color, false, activeConnMain); aMain.setAttribute('data-conn', aMainConnStr); }
                let aSub = document.getElementById(aSubDomId); if (!aSub) { aSub = document.createElement('div'); aSub.id = aSubDomId; layer.appendChild(aSub); }
                let aSubConnStr = `${activeConnSub.t}${activeConnSub.r}${activeConnSub.b}${activeConnSub.l}`; if (aSub.getAttribute('data-conn') !== aSubConnStr) { aSub.innerHTML = createPuyoSVG(activePiece.sub.color, false, activeConnSub); aSub.setAttribute('data-conn', aSubConnStr); }
                
                const axisClass = activePiece.isLanded ? '' : ' axis-puyo';
                const activeClass = ' active-puyo';
                const landingClass = activePiece.isLanding ? ' puyo-landing' : '';
                aMain.className = 'puyo-item' + axisClass + activeClass + landingClass + (isFalling ? ' falling' : ''); 
                aSub.className = 'puyo-item active-sub-puyo' + activeClass + landingClass + (isFalling ? ' falling' : '');
                
                aMain.style.left = `calc(var(--cell-size) * ${activePiece.x})`; aMain.style.top = `calc(var(--cell-size) * ${activePiece.y + fp})`; aMain.style.transform = 'none';
                aSub.style.left = `calc(var(--cell-size) * ${activePiece.x})`; aSub.style.top = `calc(var(--cell-size) * ${activePiece.y + fp})`; 
                aSub.style.transform = `rotate(${activePiece.angle}deg) translateY(-100%) rotate(${-activePiece.angle}deg)`;
            }

            Array.from(layer.children).forEach(el => { if (!el.classList.contains('chain-num-popup') && !el.classList.contains('all-clear-popup') && !el.classList.contains('puyo-burst-fragments') && !currentIds.has(el.id)) el.remove(); });
            if (puyoQueue.length >= 2) {
                const updateNext = (id, color, conn) => { let el = document.getElementById(id); let stateStr = `${color}_${conn.t}${conn.r}${conn.b}${conn.l}`; if (el.getAttribute('data-state') !== stateStr) { el.innerHTML = createPuyoSVG(color, false, conn); el.setAttribute('data-state', stateStr); } };
                updateNext('next1Main', puyoQueue[0].main, {t:0,r:0,b:0,l:0}); updateNext('next1Sub', puyoQueue[0].sub, {t:0,r:0,b:0,l:0});
                updateNext('next2Main', puyoQueue[1].main, {t:0,r:0,b:0,l:0}); updateNext('next2Sub', puyoQueue[1].sub, {t:0,r:0,b:0,l:0});
            }
        }

        let touchStartX = 0, touchStartY = 0, touchLastX = 0, touchStartTime = 0, isGameGesture = false, hasSwiped = false;
        document.addEventListener('touchstart', (e) => { if (isPaused || e.target.closest('.left-panel, .right-panel, button, .modal-card, .top-bar')) { isGameGesture = false; return; } isGameGesture = true; hasSwiped = false; const t = e.touches[0]; touchStartX = touchLastX = t.clientX; touchStartY = t.clientY; touchStartTime = Date.now(); }, { passive: false });
        document.addEventListener('touchmove', (e) => { 
            if (!isGameGesture) return; e.preventDefault(); const t = e.touches[0];
            const dy = t.clientY - touchStartY;
            const totalDx = t.clientX - touchStartX;
            const isUpSwipe = Math.abs(totalDx) <= Math.abs(dy) * SWIPE_UP_AXIS_RATIO;
            const isDownSwipe = Math.abs(totalDx) <= Math.abs(dy) * SWIPE_DOWN_AXIS_RATIO;
            const downSwipeThreshold = window.innerWidth * SWIPE_DROP_RATIO;
            if (dy > downSwipeThreshold) hasSwiped = true;
            if (isDownSwipe && dy > downSwipeThreshold) {
                dropPiece(); isGameGesture = false; 
                return;
            } else if (isUpSwipe && dy < -window.innerHeight * SWIPE_UP_RATIO) {
                undo(); isGameGesture = false;
                return;
            }
            const dx = t.clientX - touchLastX;
            const swipeThresh = window.innerWidth * SWIPE_LEFTRIGHT_RATIO;
            if (!isDownSwipe && Math.abs(dx) > swipeThresh) {
                if (dx > 0) movePiece(1); else movePiece(-1);
                touchLastX = t.clientX;
                hasSwiped = true;
            }
        }, { passive: false });
        document.addEventListener('touchend', (e) => { if (!isGameGesture || hasSwiped) return; const touchDuration = Date.now() - touchStartTime; if (touchDuration < 350) { const screenX = e.changedTouches[0].clientX; const screenW = window.innerWidth; if (screenX < screenW / 2) rotatePiece(-1); else rotatePiece(1); } }, { passive: false });

        const scoreResetBtn = document.getElementById('scoreResetBtn');
        document.getElementById('resetModal').addEventListener('click', event => {
            if (event.target === event.currentTarget) closeResetModal();
        });
        scoreResetBtn.addEventListener('pointerdown', event => {
            if (event.button === 0) startScoreResetHold();
        });
        scoreResetBtn.addEventListener('pointerup', cancelScoreResetHold);
        scoreResetBtn.addEventListener('pointercancel', cancelScoreResetHold);
        scoreResetBtn.addEventListener('pointerleave', cancelScoreResetHold);
        scoreResetBtn.addEventListener('keydown', event => {
            if (!event.repeat && (event.key === ' ' || event.key === 'Enter')) {
                event.preventDefault();
                startScoreResetHold();
            }
        });
        scoreResetBtn.addEventListener('keyup', event => {
            if (event.key === ' ' || event.key === 'Enter') cancelScoreResetHold();
        });
        window.addEventListener('blur', cancelScoreResetHold);
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) cancelScoreResetHold();
        });
        
        document.addEventListener('keydown', (e) => { 
            if (isPaused) return;
            const key = e.key; const lowerKey = key.toLowerCase();
            if (key === 'ArrowLeft' || lowerKey === 'a') movePiece(-1); 
            if (key === 'ArrowRight' || lowerKey === 'd') movePiece(1); 
            if (key === 'ArrowDown' || lowerKey === 's') dropPiece(); 
            if (lowerKey === 'z' || lowerKey === 'q' || key === '/') rotatePiece(-1); 
            if (lowerKey === 'x' || lowerKey === 'e' || key === 'ArrowUp') rotatePiece(1); 
            if (lowerKey === 'y' || lowerKey === 'r') openResetModal(); 
            if (lowerKey === 'u' && document.activeElement.tagName !== 'INPUT') undo(); 
        });

        window.onload = () => { if (!loadResumeData()) startGame(); else render(); openResetModal(); };
        window.addEventListener('blur', saveResumeData); window.addEventListener('beforeunload', saveResumeData);
    </script>
